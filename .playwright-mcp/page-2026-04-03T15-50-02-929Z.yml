                      - row [ref=e486]:
                        - cell [ref=e487]:
                          - generic [ref=e488]:
                            - 'link "Quote from: countryfree on February 11, 2017, 12:12:19 AM" [ref=e490] [cursor=pointer]':
                              - /url: https://bitcointalk.org/index.php?topic=1785667.msg17808487#msg17808487
                            - generic [ref=e491]:
                              - text: Just a reminder.
                              - text: From my European bank account, I can make a SEPA transfer to any other European bank account for free. No fee. Nothing to pay. It normally takes one and a half business day so BTC is faster, way faster, but that's not always the case because of the congestion. That used to be exceptional but it's getting the norm. The only way out is a higher fee, which makes BTC less appealing.
                              - text: Sure, BTC remains the best option for extra-European transfers, and BTC still has the advantage of privacy by being difficult to link to one individual, but all miners and developers shall never forget there's competition out there. Banks, Paypal, Skrill... If BTC wants to be the best, it really needs to be the best.
                            - text: Money is what money does. I want a SEPA account! Why bother with bitcoin just to get fast and cheap transactions? There's a better alternative for that. Artificially capping size of blocks limits the usefulness of the network. Bitcoin is not worth $100 in its current implementation, imho.
                      - row [ref=e492]:
                        - cell [ref=e493]
