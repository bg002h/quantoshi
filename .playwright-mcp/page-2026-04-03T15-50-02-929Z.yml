                            - 'link "Quote from: Gatorelf on March 06, 2017, 11:12:38 AM" [ref=e276] [cursor=pointer]':
                              - /url: https://bitcointalk.org/index.php?topic=1814894.msg18084942#msg18084942
                            - generic [ref=e277]:
                              - text: I'm interested just not that rich lol
                              - text: wow a complete set, I see you are a legendary member would love to hear the history of bitbills ( who funded etc) if you have some to share and of your purchase. 2011?
                            - text: I ordered two full sets in May 2011. BitBills was gone by September. I don't know how many they ever sent off, but demand was huge and it took forever for some people to get theirs. I x-rayed a one bitcoin bill just to see if any metal pigment from the private key could be discovered. I posted on it here at the time. I believe I sent that bill to Luke Dashjr (he was new to mining back then and was one of the few, if not the only, mining pool operator being verifiably honest about appropriately sharing block rewards with miners).
                            - text: BitBills were the idea of a couple guys at MIT. One guy's name was Doug Feigelson. They must've gotten good legal advice early on because they were not around long. I believe they tried to patent this general idea of using a sticker to hide something, but I'm not certain how such an obvious idea could've been patented in the first place.
                            - text: Anyhow, I defunded the incomplete set in 2012 or 2013. I still have a cut open 5, 10, and 20. I have no idea when the last full set was sold.
