                  - table [ref=e399]:
                    - rowgroup [ref=e400]:
                      - row "That many transactions will cost a small fortune to consolidate. Like about 1 bitcoin in fees. You could save money on that step in a post-segwit world, but tx fees may be higher by then. With fees getting higher and higher, your use of the bitcoin blockchain for small payments is being pushed out. There's no telling if bitcoin will be useful as a money for stuff like this or not in the future. Maybe we all should consolidate before our outputs are not worth spending (beware the privacy issues here!)." [ref=e401]:
