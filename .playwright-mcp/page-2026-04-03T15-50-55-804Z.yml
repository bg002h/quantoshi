                              - generic [ref=e643]:
                                - text: Can you guys provide sources for your varying definitions of "soft fork" and "hard fork?"
                                - text: "I've found this:"
                                - link "http://bitcoin.stackexchange.com/questions/36090/has-a-hard-fork-ever-occurred" [ref=e644] [cursor=pointer]:
                                  - /url: http://bitcoin.stackexchange.com/questions/36090/has-a-hard-fork-ever-occurred
                                - text: "This:"
                                - link "https://bitcoin.org/en/glossary/hard-fork" [ref=e645] [cursor=pointer]:
                                  - /url: https://bitcoin.org/en/glossary/hard-fork
                                - text: "And this:"
                                - link "https://www.reddit.com/r/Bitcoin/comments/2s2utx/the_hard_fork_missile_crisis/cnlqcd1/" [ref=e646] [cursor=pointer]:
                                  - /url: https://www.reddit.com/r/Bitcoin/comments/2s2utx/the_hard_fork_missile_crisis/cnlqcd1/
                                - text: My very amateur understanding is that there seems to be an amorphous definition of "hard fork" depending on how one is using it. There are instances where a network split is referred to as a "hard fork" relative to the network state, and there are times when it is used to refer to a "software update without backward compatibility." But then Peter Todd (in the above reddit link) argues that we should not even be referring to what happened in 2013 as a "hard fork."
                                - text: He also argues that a hard fork means "previously allowed behavior is now rejected, for instance creating coins out of thin air." But I think this might not be precise enough, since the previous block size changes were implemented with a soft fork and not a hard fork.
                                - text: "If we can get some consistency, it might provide a stable foundation from which to argue re: the block size debate."
                                - text: IF bitcoin has never dealt with a hard fork (this would depend on the definition we use), there can be made a substantial argument that if we have no prior experience with measuring the outcomes of a hard fork, we have no way of knowing with certainty the impact of doing so.
