                                - generic [ref=e689]: Can you guys provide sources for your varying definitions of "soft fork" and "hard fork?"
                                - text: The first instance of the regex "hard ?fork" on this forum is
                                - link "this post" [ref=e690] [cursor=pointer]:
                                  - /url: https://bitcointalk.org/index.php?topic=61922.msg725644#msg725644
                                - text: in its link to
                                - link "https://en.bitcoin.it/w/index.php?title=Hardfork_Wishlist&oldid=23227" [ref=e691] [cursor=pointer]:
                                  - /url: https://en.bitcoin.it/w/index.php?title=Hardfork_Wishlist&oldid=23227
                                - text: The rough idea of a hardfork being a change to the consensus rules requiring old nodes to upgrade has remained basically the same forever.
                                - text: I agree with gmaxwell's old response to my post here classifying the version checksum as a hardfork; since that didn't affect the consensus rules, it wasn't a proper hardfork. It did have very similar effects as a hardfork, though, and it's the closest model to the sort of planned-in-advance hardfork often talked about. I'm on the fence about whether BIP 50 can be classified as a hardfork, and it's also very different from any hardfork that would be planned.
