                                - generic [ref=e217]:
                                  - text: "I think that the only two hardforks were:"
                                  - text: "- The change in the version message which took effect on February 20, 2012 after two years of advance notice."
                                - text: This is a hardfork of the P2P protocol, but not the blockchain. If you setup a protocol adapter (e.g. a node hacked to change its version handshake to bring the old behavior back) a prior release should still sync the chain... though it's been a while since I've done this.
                                - generic [ref=e218]: Quote
                                - generic [ref=e219]: "- BIP 50"
                                - text: Sort of a mixed bag there, you can actually take a pre BIP-50 node and fully sync the blockchain, I last did this with 0.3.24 a few months ago. It just will not reliably handle reorgs involving large blocks unless you change the BDB config too. So it's debatable if this is a hard fork either, since it's quasi-non-deterministic. There were prior bugs fixed where older versions would get stuck and stop syncing the chain before that too...
                                - text: So I think by a really strong definition of creating a blockchain which violates the rules mandated by prior versions we have never had a hardfork.
