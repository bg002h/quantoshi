                              - separator [ref=e119]
                              - generic [ref=e120]:
                                - text: Hello to all,
                                - text: "I'm trying to gather information about Hardforks and rollbacks that Bitcoin has done in the Past. I'm writing an article but I'm finding hard to gather that information, that's why I ask the help of the community. I think this is a very important subject and it requires a clear list of occurrences like: Date, Cause, Solution"
                                - text: "Until now I only could gather this information:"
                                - generic [ref=e121]: Quote
                                - generic [ref=e122]:
                                  - text: 8th August 2010 - 92 billion BTC into existence
                                  - text: "On 8th August 2010 bitcoin developer Jeff Garzik wrote what could be mildly described as the biggest understatement since Apollo 13 told Houston: “We’ve had a problem here.”. “The ‘value out’ in this block is quite strange,” he wrote on bitcointalk.org, referring to a block that had somehow contained 92 billion BTC, which is precisely 91,979,000,000 more bitcoin than is ever supposed to exist. CVE-2010-5139 (CVE meaning ‘common vulnerability and exposures’) was frighteningly simple and exploited to the point of farce by an unknown attacker. In technical language, the bug is known as a number overflow error.So instead of the system counting up 98, 99, 100, 101, for example, it broke at 99 and went to zero (or -100) instead of 100. In layman’s terms, someone found a way to flood the code and create a ridiculously large amount of bitcoin in the process."
                                  - text: The fix was the bitcoin equivalent of dying in a video game and restarting from the last save point. The community simply hit ‘undo’, jumping back to the point in the blockchain before the hack occurred and starting anew from there; all of the transactions made after the bug was exploited – but before the fix was implemented – were effectively cancelled.
                                  - text: "How serious was it? Bitcoin’s lead developer Wladimir Van Der Laan is pretty blunt about it, telling me: “It was the worst problem ever.”"
                                  - text: "Source1:"
                                  - link "http://www.coindesk.com/9-biggest-screwups-bitcoin-history/" [ref=e123] [cursor=pointer]:
                                    - /url: http://www.coindesk.com/9-biggest-screwups-bitcoin-history/
                                  - text: "Source2:"
                                  - link "https://bitcointalk.org/index.php?topic=822.0" [ref=e124] [cursor=pointer]:
                                    - /url: https://bitcointalk.org/index.php?topic=822.0
                                - generic [ref=e125]: Quote
                                - generic [ref=e126]:
                                  - text: 11/12 March 2013 - Chain Fork Information
                                  - text: "What happened: A bitcoin miner running version 0.8.0 created a large block (at height 225,430) that is incompatible with earlier versions of Bitcoin. The result was a block chain fork, with miners, merchants and users running the new version of bitcoin accepting, and building on, that block, and miners, merchants and users running older versions of bitcoin rejecting it and creating their own block chain."
                                  - text: What is being done:Large mining pools running version 0.8.0 were asked to switch back to version 0.7, to create a single block chain compatible with all bitcoin software.
                                  - text: Questions & Answers
                                  - text: I'm not a miner or a merchant, what should I do?
                                  - text: Nothing. Your bitcoin software will switch to the correct chain automatically, no matter which version you are running.
                                  - text: Are my bitcoins safe?
                                  - text: Yes.
                                  - text: What will be done
                                  - text: The core developers have investigated what caused the old versions to reject the new blocks, and have released a 0.8.1 version that avoids creating blocks that are incompatible with older versions. A full post-mortem document has been published.
                                  - text: "Source1:"
                                  - link "https://bitcoin.org/en/alert/2013-03-11-chain-fork" [ref=e127] [cursor=pointer]:
                                    - /url: https://bitcoin.org/en/alert/2013-03-11-chain-fork
                                  - text: "Source2:"
                                  - link "http://bitcoinmagazine.com/3668/bitcoin-network-shaken-by-blockchain-fork/" [ref=e128] [cursor=pointer]:
                                    - /url: http://bitcoinmagazine.com/3668/bitcoin-network-shaken-by-blockchain-fork/
                                - text: "I also found this list:"
                                - link "https://en.bitcoin.it/wiki/Common_Vulnerabilities_and_Exposures" [ref=e129] [cursor=pointer]:
                                  - /url: https://en.bitcoin.it/wiki/Common_Vulnerabilities_and_Exposures
                                - text: but i'm finding hard to identify the ones that had a hardfork / rollback...
                                - text: So, I ask for help again with this, Can anyone help me with this? It's not only for me but for all the Bitcoin and Crypto Community. Thanks in advanced!
