                              - separator [ref=e355]
                              - generic [ref=e356]:
                                - text: Well there's a crucial distinction to be made between
                                - text: a) Sudden, completely unexpected hard forks due to bugs/unexpected behaviour in the code (bitcoin itself, or ancillary stuff such as database management), and
                                - text: b) Hard forks predicted and planned several months in advance, due to perceived need to improve weaknesses in the protocol or code or both, and implemented by a consensus-of-miners-switchover
                                - text: The bazillion-btc and broken-db hardforks that happened in 2010 and 2013 are examples of the former. Increasing the blocksize to 20MB, 8MB or whatever is an example of the latter. In the former everyone could see that the 'new' fork had highly undesirable behaviour and so it was straightforward for the devs to tell everyone to roll back - no one thought the 'new' chain was somehow The One True Bitcoin. In the latter, there is a difference of opinion as to the 'brokenness' of each subsequent chain.
                                - text: (I know the OP probably wasn't 'going there', but with all the angst at the moment, I think it *needs* to be said.)
                                - text: (In any case I was mostly responding to pereira4's last sentence.)
