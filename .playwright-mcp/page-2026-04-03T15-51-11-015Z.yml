                                  - generic [ref=e623]:
                                    - text: What are some of your biggest bitcoin regrets, and what were you thinking back then?
                                    - text: Besides "not getting in sooner"
                                    - img "Grin" [ref=e624]
                                    - text: "Obligatory: BFL"
                                    - img "Tongue" [ref=e625]
                                    - text: "EDIT:"
                                    - link "Bitcoin \"mistakes\" go here =)" [ref=e626] [cursor=pointer]:
                                      - /url: https://bitcointalk.org/index.php?topic=165309.0
                                  - text: My big regret in the bitcoin was the scam . I was scammed by a person who teach me bitcoin lesson .
                                  - text: He told me he will give me a trick to make huge amount of bitcoin without limit , but he will take 0.019btc for the trick .
                                  - text: I made work hard in the faucet site for free satoshi per hour and finally I made 0.019btc but when I gave to that person who was saying will give trick , scammed me . He take the bitcoin and gave a stretagy of gambling in the freebitco.in that was totally irritating and not much profitable .
                                  - text: Then I left bitcoin for 1 year but after 1 year I come back and started all things by own .
                                - text: You are probably destine to stay in bitcoin, your sad experience must be a lessons learned for you. When we are newbie, it cannot be avoided we got fooled by people who has nothing to do but to scam in the community, actually you do not lose a big amount compared to me.
                                - text: I have invested in HYIP's in the past and as far as I remember, I guess I was able to put at least BTC0.1 in total. I diversified actually thinking some of them were legit, but I was wrong then, and was sad for awhile, I'm just thankful I have move on fast unlike you that it take a year. Anyway, good job boy.
