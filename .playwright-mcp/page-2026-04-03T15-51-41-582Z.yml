                        - 'cell "on: January 04, 2015, 04:29:38 AM" [ref=e405]'
                  - table [ref=e406]:
                    - rowgroup [ref=e407]:
                      - row "Satoshi knew pool mining was coming just like he knew gpu mining was coming. Back when I was mining with my laptop, the tiny bitcoin mining world was about to shrink to include only those willing to buy gpu's. Satoshi saw that as bad because it would mean that it would take longer for a large number of people to obtain bitcoin. There was a gentlemen's agreement to delay gpu mining. I think coming up with a way to break blocks up so that 250 computers could mine 1/250th of a block while maintaining hash power in the network would help solve the pooling/central hashing issues." [ref=e408]:
