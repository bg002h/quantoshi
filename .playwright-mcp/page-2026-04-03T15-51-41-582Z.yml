                              - generic [ref=e488]: How can we be the new wealthy elite if bitcoin has the purchasing power of 1USD?
                              - text: all you need is the cool aid everyone is on around here. Faith can move mountains, you know?
                              - 'link "Quote from: bg002h on December 31, 2014, 04:00:38 AM" [ref=e490] [cursor=pointer]':
