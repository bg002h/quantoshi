                          - generic [ref=e286]:
                            - 'link "Quote from: bigkahuna on January 11, 2015, 12:02:01 AM" [ref=e288] [cursor=pointer]':
                              - /url: https://bitcointalk.org/index.php?topic=920157.msg10108744#msg10108744
                            - generic [ref=e289]:
                              - text: Is Bitcoin really this safe with all this hacking going on?
                              - text: I really need to know before I throw a ton of money towards it.
                            - text: If you give someone your money and they promise to take care of it for you, then the probability of loss is very high...this is true with conventional currency too though (though the loss is born by other people, not the depositor, in most cases).
                            - text: "Lesson 1: trust no one with your money."
                            - text: "Lesson 2: if you must break lesson 1, make sure you only bear a tiny fraction of the burden of loss (ie, be a citizen in a country where the people insure deposits via government program or otherwise)."
                            - text: "Lesson 3: If you truly want to protect your bitcoins, it can be done but it requires work, knowledge, and skill...although less now than in years past. If you are throwing non-trivial sums into bitcoin, buy a Trezor and learn how to use it and how to back up a wallet seed securely."
