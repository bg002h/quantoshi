                              - generic [ref=e491]: Incentives need to stay aligned throughout the growth of the network.
                              - text: incentives for what? The miners or the investors? What we have gone through was too much incentive for mining and not enough for investing. Bitcoin is not balanced enough and provides no incentive for investors because it heavily favours miners. In fact Bitcoin is just one big wealth redistribution from the investors to the miners. So now you have a lot of miners and no investors.
