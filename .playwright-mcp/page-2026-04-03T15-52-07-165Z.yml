                                - 'link "Quote from: Elwar on January 03, 2015, 08:31:50 PM" [ref=e601] [cursor=pointer]':
                                  - /url: https://bitcointalk.org/index.php?topic=913145.msg10026300#msg10026300
                                - generic [ref=e602]:
                                  - text: I work for General Dynamics, a company that is suckling on the US government's teet. They would never risk their sweet military industrial complex relationship with the government by accepting bitcoins.
                                  - text: I use bitwage.co (I do not work for them, just happy that I can get paid in Bitcoin).
                                  - text: I set up my direct deposit to the account number they provided me and my last paycheck it was all converted to bitcoins automatically. My bank never saw a penny of my paycheck.
                                  - text: That is the first step in dumping my bank forever.
                                  - text: For spending money I usually sell on localbitcoins for a profit anyway so I always have some cash on hand. And pretty much anything I want online can be paid in Bitcoin.
                                - text: I think more people should follow your initiative. However I am afraid converting 100% of salary on a monthly basis is still risky. I would like to go with 10-20% though. Is there any way to do so?
                                - text: Another concern I have are fees for this service and overall financial benefit for both me and an employer.
                                - text: 1) Converting my wage into BTC so I can make use of BTC infrastructure should bring me benefits over doing the same with fiat. At least it must save me transaction fees which I would have to pay if I buy anything with fiat.
                                - text: 2) Both my employer and me should have tax release for an amount converted into BTC as this could be treated as company benefit.
