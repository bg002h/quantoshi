                                - generic [ref=e526]: I'm fairly new to crypto. Have bought some through coinbase. But looking to transfer to a hard wallet. My question is this. Let's say all of us dreamers and pumpers dreams come true and bitcoin and crypto take off. We all have a number in our head of what we would sell some or most of our crypto if it reached that number. What is your exit strategy? Did most of you buy through coinbase and will just transfer back into there? Would they be able to support millions of people withdrawing hundreds of thousands of dollars? Crypto seems fairly liquid but again if it shoots to the moon, how liquid will it really be?
                                - text: I think the exit limit is all in your mentality. You have to decide number that you are going to exit and stick to it and mind train yourself that you are satisfied or you will fall in the pits of greed. And until now, everytime the price went up, there were always "not really clever people" or fools(I must say) that invest on the rise. most cases in coins are pumping and when enough people invest looking at the rise, the ones with lots of money withdraw and people will be trapped.
