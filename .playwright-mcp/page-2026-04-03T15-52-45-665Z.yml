                                - generic [ref=e577]: I'm fairly new to crypto. Have bought some through coinbase. But looking to transfer to a hard wallet. My question is this. Let's say all of us dreamers and pumpers dreams come true and bitcoin and crypto take off. We all have a number in our head of what we would sell some or most of our crypto if it reached that number. What is your exit strategy? Did most of you buy through coinbase and will just transfer back into there? Would they be able to support millions of people withdrawing hundreds of thousands of dollars? Crypto seems fairly liquid but again if it shoots to the moon, how liquid will it really be?
                                - text: I'm sure since we are different people we also do have different perspectives inside this industry, individually speaking, some might sell right away after the wave, some will still holds hoping that market will continue to rise high, most of the greed think that way I guess, while those who knows how to play well will act accordingly, sell partially and observe what tomorrows will bring to his assets before engaging back again.
                                - text: Exit strategy is very important, you have to choose your exit point and make sure to follow as it was planned correctly.
