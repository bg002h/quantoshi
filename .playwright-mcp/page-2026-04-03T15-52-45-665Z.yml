                                - text: Well I bought some litecoin last year when it hit 100, having a fairly good idea that once it broke that psychological barrier, it would go up. I woke up 2 weeks later, and it was the day it went up to up to almost 400. By chance I had woken up at the right time, and was able to sell some of mine near the peak, so I could bank some profit. Since then, I have been slowly gathering some more, and I am looking at getting a cold wallet as I don't trust coinbase to hold my money, especially during the next bull run.
                                - text: I don't intend to cash out all my crypto, but I would consider myself a fool if I didn't sell some for a nice gain during the next bull run. I'm just trying to figure out the best way to do that. Last time, I had no problem with coinbase. But if this next bull run is 30x what the last one was, I agree with you that posted that I should not just rely on one exchange. I'm just trying to develop a good strategy because I have a feeling that this next run will be crazy and unexpected, and you don't want to try and do it on the fly.
                                - text: As far as a cold wallet, I'm sure there isn't much difference. But does anyone have a preference of nano s or the trezor? Those seem to be the 2 most popular. Or should I preorder the Nano X?
