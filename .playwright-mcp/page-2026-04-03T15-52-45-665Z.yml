                                - generic [ref=e405]: The bigger exchanges have shown before that they could not handle the excess load in scenarios like this, so they frequently go down in runs like this. <A lot of these crashes are possibly initiated/faked by them in my opinion>
                                - text: that usually happens on the way up, not on the way down.
                                - text: it's during the bubble that exchanges are taking on massive growth over a very short period, so their trading engines can't handle the load. at the top (or after the bubble has already popped) there is less and less new money (new user growth) flowing in. so it crashes.
                                - text: so i don't think it's manipulation. i've seen too many would-be manipulators get swallowed up by strong buying demand. bubbles pop because there's no demand left to sustain them. and then everyone starts panic selling into thin books, crashing the price.
