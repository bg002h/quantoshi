                      - row [ref=e298]:
                        - cell [ref=e299]:
                          - generic [ref=e300]:
                            - text: I think some cultures will chose to use milliBits and other bits. With a bit having essentially zero value now, it will be a while before they are likely to be used (in single units) economically. But, it doesn't hurt to prepare. I don't think a Satoshi will be an economically useful unit in my lifetime (ie, >1¢). Satoshi's will be useful for non-economic tasks (like trading large volumes of altcoins values in pennies), but even the poorest of the poor wouldn't use any currency unit of so little value.
                            - text: The advantage to bits is that the two decimal places following a bit gives precision down to the Satoshi. Lots of cultures use 2 or 3 decimal places after their major currency unit. Not culture uses 5 or more (some international banking currency units use 4 decimal places).
                            - text: At any rate, I think we should have unique unicode symbols for 4 denominations such that they don't casefold (eg, a lowercase Ƀ is ƀ...they both can't be used as symbols like $ and ¢...otherwise a sticky caps lock key could cost a fortune!)
                      - row [ref=e301]:
                        - cell [ref=e302]
