                  - table [ref=e535]:
                    - rowgroup [ref=e536]:
                      - row [ref=e537]:
                        - cell [ref=e538]:
                          - generic [ref=e539]:
                            - 'link "Quote from: Ron~Popeil on July 11, 2014, 12:12:53 AM" [ref=e541] [cursor=pointer]':
                              - /url: https://bitcointalk.org/index.php?topic=685298.msg7778766#msg7778766
                            - generic [ref=e542]:
                              - 'link "Quote from: colinistheman on July 10, 2014, 11:12:04 PM" [ref=e544] [cursor=pointer]':
                                - /url: https://bitcointalk.org/index.php?topic=685298.msg7778023#msg7778023
                              - generic [ref=e545]:
                                - text: The Bitcoin Foundation needs to be disbanded. I certainly didn't vote on having a Foundation and I don't think many/any of us did. It violates the entire principal of decentralization.
                                - text: A centralized entity such as the Bitcoin Foundation will only try to introduce centralized solutions to a decentralized technology, and it can become a target for governments and corruption and manipulation.
                                - text: I suspect The Bitcoin Foundation has motives counter to the purpose of Bitcoin itself. It wouldn't surprise me if goverments are trying to plant people inside this Foundation to alter its course and attempt to gain a foothold on how Bitcoin develops.
                                - text: Without the Foundation there is no central target, which is how it is supposed to be.
                                - text: "The next step is: How is this accomplished?"
                              - text: No need to disband it if people simply ignore it. The bit coin foundation is irrelevant. No need to give them any relevance by trying to disband them.
                            - text: I'm curious why people think centralized efforts and pooling of resources somehow "violates" some fundamental principle of Bitcoin. The foundation can not hurt Bitcoin. The foundation can not "run" Bitcoin. Centralized efforts and decentralized efforts are orthogonal to each other -- both can exist without affecting the other.
                            - text: The foundation is, at worst, a paper tiger. Having the foundation as "a central target" would amount to nothing but a decoy -- the foundation is not Bitcoin.
                            - text: If I pay a developer's salary, or 5 developers salaries, does that make me a centralized entity? What if theymos used donated funds to pay Bitcoin core devs? Would he be a centralized entity? Of course not.
                      - row [ref=e546]:
                        - cell [ref=e547]
