                        - cell "311" [ref=e407]
                        - 'cell "Economy / Scam Accusations / Re: Calling out the Bitcoin Foundation Scam." [ref=e408]':
                          - link "Economy" [ref=e409] [cursor=pointer]:
                            - /url: https://bitcointalk.org/index.php#3
