                          - 'link "Re: Calling out the Bitcoin Foundation Scam." [ref=e411] [cursor=pointer]':
                            - /url: https://bitcointalk.org/index.php?topic=498002.msg5495580#msg5495580
                        - 'cell "on: March 04, 2014, 03:27:03 AM" [ref=e412]'
                  - table [ref=e413]:
                    - rowgroup [ref=e414]:
                      - row [ref=e415]:
                        - cell [ref=e416]:
                          - generic [ref=e417]:
                            - 'link "Quote from: MPOE-PR on March 03, 2014, 08:37:03 AM" [ref=e419] [cursor=pointer]':
                              - /url: https://bitcointalk.org/index.php?topic=498002.msg5478205#msg5478205
                            - generic [ref=e420]:
                              - text: The Bitcoin Foundation was a large confidence scam perpetrated on the very naive, rather noobish yet very vain Bitcoin community cca 2012-2014 - and running for about as long as Pirate's ponzi.
                              - text: It was thought out, constructed and initially run by Peter Vessenes, and then passed along to various accomplices. (Don't imagine that if I don't name you, we don't have the file. We have the file. You will be serving time, in all likelihood.)
                              - text: "It worked like so:"
                              - text: 1. Collect donations from the clueless yet vain. Because Bitcoin is full of people who belabour under the delusion that if they speak a lot about Bitcoin, if they paint "Bitcoin" all over the four walls of their dwelling and so on then they're somehow "part of Bitcoin". Charging these idiots a hefty fee for an "official" stamp of approval* is a logical next step, and it collected a massive warchest (even more than the thousands of BTC this forum - also run on MtGox servers - has collected for "software upgrades").
                              - text: The CEO and Treasurer at the time, one
                              - link "Peter Vessenes" [ref=e421] [cursor=pointer]:
                                - /url: http://trilema.com/2013/recapitulatio/
                              - text: simply pocketed this money. No report was ever published, no report will ever be published. More advanced than the MtGox scam, the Foundation is a "non profit" and it has no creditors, so nobody has standing to take them to court.
                              - text: 2. Vouch for scams. It is very lucrative to sell protection; that's what most underworld kingpins do for a living. That's what the Bitcoin Foundation did for a living too, once the BTC price went up and the dubious character of the people running it became public knowledge (ie, once MP said so). With dwindling donation income and a never ending hunger for cash**, the Bitcoin Foundation was repurposed as a voucher for whoever could afford to pay. Like BFL. Like MtGox.
                              - text: The only reason Pirate wasn't vouched for by the Bitcoin Foundation is that
                              - link "I killed him" [ref=e422] [cursor=pointer]:
                                - /url: https://bitcointalk.org/index.php?topic=50822.msg854918#msg854918
                              - text: before he had a chance. The only reason the Patrick Harnett scammer didn't end up on their board is because
                              - link "MP killed him" [ref=e423] [cursor=pointer]:
                                - /url: https://bitcointalk.org/index.php?topic=121915.0
                              - text: before he had a chance. The only reason Silk Road's guy wasn't vouched for by the Bitcoin Foundation is that he couldn't be bothered (or afford) to pay them. The only reason TradeFortress wasn't similarly has to do with cash. And this list could go on.
                              - text: "Think things through: it's not so hard to collect five thousand Bitcoin and then from that pay fifty to some clueless, famished nerd or other."
                              - text: It's not hard to pretend like you're professional while you're lying through your teeth and defrauding everyone in sight.
                              - text: It's not hard to pretend like you have "public support" when you're only talking to the clueless noobs that joined yesterday, who think Auroracoin actually "has a market cap" and so on. In a population of
                              - link "19 yo Xavier Uni graduates" [ref=e424] [cursor=pointer]:
                                - /url: https://sites.google.com/site/surfcapitalmgmt/about-us
                              - text: ", any lie can pass for truth if large enough and repeated often enough."
                              - text: What is hard is to stand for something, what is hard is to speak the uncomfortable truths***, what is hard is to keep promises and to refuse to make promises that can't be kept and to tell would-be "powers that be" to pack it and move because Bitcoin is taking over.
                              - text: But the Bitcoin Foundation isn't in the business of all that. The Bitcoin Foundation was in the business of taking money from they too stupid to keep it, and votes from they too clueless to have any money, and then sell the package to the highest bidder. Whoever it may be. Vessenes & co gotta be bought out after all, it's not like the shit they do has any intrinsic value whatsoever. Acquisition or bust, it's what they learned, it's what they do, it's what they'll teach you, if you'll let them. (And if you do let them you might as well use fiat, seriously now. It's easier, and insured.)
                              - text: So now they're decamping to the UK in the hopes they may avoid US side prosecution, (a move deeply reminiscent of Vleisides, incidentally). Derp. You're all going to jail, boys and girls. You're all going to jail for being thieves, and liars, and con men. And to quote from
                              - link "a much older article of MP's" [ref=e425] [cursor=pointer]:
                                - /url: http://trilema.com/2013/preemptive-strike-to-have-on-hand-for-when-butterfly-labs-gets-hauled-off-to-jail-in-corpore/
                              - text: "(funny how that guy always wrote today's article months ago, isn't it?):"
                              - generic [ref=e426]: Quote
                              - generic [ref=e427]:
                                - text: There’s just no way this little experiment in mishandling other people’s money can end up anywhere other than in a court, and there’s pretty good odds that it will be through penal rather than civil proceedings - the people involved are too many and too stupid for the state not to intervene.
                                - text: Once that happens, I am positive and certain that the same people who are now running around calling their betters names will try to turn things into some sort of “mean state infringing on people’s rights”. They have a fine record at trying exactly that.
                                - text: "The problem is, the lot of them being packed up and hauled to jail would be no such infringement. It is at this point perfectly reasonable and quite unavoidable. Sure, they’ll try and sell this libertarian angle, that’s the curse of being pro-freedom : all the scumbags try to exploit you for their little profit turning “ideas”. It won’t wash. The girl that already beat you in the PR marketplace will beat you again, dear Sonny & co. She has the material right here."
                              - text: "---"
                              - text: "* See this excellent quote from"
                              - link "Chris Ballas" [ref=e428] [cursor=pointer]:
                                - /url: http://thelastpsychiatrist.com/2014/03/who_can_know_how_much_randi_zu.html
                              - text: ":"
                              - generic [ref=e429]: Quote
                              - generic [ref=e430]:
                                - text: "And here I have to go back over something. The harder part of the psychology is that the demo doesn't want to become full time traders, either at home all day or on Wall Street-- that part must remain a fantasy-- because then it would be a job and it wouldn't count; it has to be a side gig, then their success wasn't their \"work self\" but their \"real\" self; no one else can claim a sliver of that success-- not the liberals with their \"'entrepreneurs' just pretend they don't benefit from public services!\" or the wives with their \"behind every good man...!\" or the echoes of their father yelling, \"you need to apply to Sperry Rand, now there's a company you can put in forty years with!\" It all happened in their head, no one else can share the credit, it is 100% a consequence of their personal value. Bonus: if they fail, it can be quickly discounted as merely a hobby-- that wasn't, after all, their real self."
                                - text: "The mistake is in thinking this has anything to do with the money. It's said that most at home traders fail, but this is incorrect: they fail at making money, but they are successful at feeling like a trader. That is the goal; the money is secondary, which is why they fail at making it. The buy/hold/reinvest the dividends strategy of Buffet is totally opposite to what's desired, because the strategy does not involve market timing or status updates, it is on autopilot, and there's no \"i\" in autopilot. Well, there's one, but it doesn't stand out."
                              - text: "** This is the problem with scum posing as businessmen: the things they make aren't cash generators, they're cash black holes. This is fundamentally why we don't want scum to pass for businessmen: not because we don't like their ugly mugs, but because we don't want to be surrounded by \"businesses\" that only work if someone somewhere keeps printing money. We're not trying to re-build the US pseudo-economy here, quite the contrary."
                              - text: "*** From"
                              - link "You Are The 98%" [ref=e431] [cursor=pointer]:
                                - /url: http://thelastpsychiatrist.com/2011/10/you_are_the_98.html
                              - text: ":"
                              - generic [ref=e432]: Quote
                              - generic [ref=e433]:
                                - text: There's a difference between what you need and what you want, and the media will always, relentlessly give you what you want. Do you know why you have such poor candidates every single election? Because you want them, you want someone you can easily judge for some sexual indiscretion or because they called latinos chicanos. "Well, that matters to us!" Then you got what you asked for.
                                - text: The media will have data mined the culture and chosen for you two cans of Campbell's Chicken Soup, and then encouraged a public debate about which can is a better representation of the spirit of the country, the one on the left or the one on the right. "Well, that matters to us!" I know.
                            - text: Undoing the ignore long enough to skim this post was just not a wise move on my part...
