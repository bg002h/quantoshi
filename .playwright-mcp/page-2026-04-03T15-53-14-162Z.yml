                  - table [ref=e496]:
                    - rowgroup [ref=e497]:
                      - row [ref=e498]:
                        - cell [ref=e499]:
                          - generic [ref=e500]:
                            - text: Believe it or not, a newbie's post on a forum is not likely to get noticed by the Bitcoin Foundation. While I'm a member of the foundation, I don't speak for the foundation (just like I'm a donator here but I don't speak for bitcointalk.org).
                            - text: Anyhow, The domain name issue you speak of is news to me and of doubtful significance. The Foundation didn't pave a way to MtGox; rather, MtGox paved the way to established a Foundation (with the help of a few others).
                            - text: You assert the Foundation accepted funds while MtGox was on the verge of bankruptcy, what do you mean? If you mean they've been on the verge of bankruptcy for a few years and they paid membership dues, then, uh...duh... If you mean something more relevant, explain yourself. I can only speak for myself, but, no Mark didn't pay me (or AFAIK any of my
                            - link "my 800 friends" [ref=e501] [cursor=pointer]:
                              - /url: https://members.bitcoinfoundation.org/current
                            - text: ) anything.
                            - text: All this said, I do think those who lost funds will end up having some recourse; the amounts they recover will depend on what exactly happened and where the funds are. AFAIK, the truth about what exactly happened isn't known, not even to MtGox.
                            - text: "But don't confuse the two organizations: MtGox and the Bitcoin Foundation had one thing in common: Mark was a board member on both. While he essentially ran MtGox, he was just one of 5-7 board members at the Foundation. Mark did not run the Bitcoin Foundation. In fact, of the"
                            - link "minutes currently available" [ref=e502] [cursor=pointer]:
                              - /url: https://bitcoinfoundation.org/forum/index.php?/topic/429-board-meeting-minutes/
                            - text: (which is OOD, IMHO), Mark didn't go to Foundation board meetings and instead sent his second in command to the board meetings (who attended 70% of them).
