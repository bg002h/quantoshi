                                - text: Also, I don't fear that Bitcon Shop was set up to exact bitcoins in some nefarious way by the principles, with the exception of extracting vitals, at the very worst.
                                - text: All things being equal, them being the first Bitcoin entity to trade on a major stock exchange should boost the bitcoin exchange rate higher, but it comes with a major expense for those who treasure their's, and other's privacy.
