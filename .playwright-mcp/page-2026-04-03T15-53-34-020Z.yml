                                  - text: Alright. so what's that part about? What are they tracking?
                                - text: They're tracking your dog.
                                - img "Grin" [ref=e153]
                                - text: Seriously, it's probably just set up as another data mining entity to extract as much vitals from bitcoiners as possible. I'm not trying to be a conspiracy nut here, but this entity is too obvious, and I, for one, wouldn't trust providing them with any of my vitals if I wanted to remain pseudo-anonymous, of which I'm not.
