                            - 'cell "Re: Your opinion: Best Bitcoin Non-Trust Transactions Solution? February 02, 2013, 06:23:33 AM #12 Quote from: casascius on February 02, 2013, 05:34:51 AM If G*a or G*b were wrong, the \"Alice and bob make sure they generated the same Bitcoin address\" would fail. About the only way I see it failing is if escrow agent sent a and G*b to both Alice and Bob under the pretense they were different, and then lost the value for b. I calculate n = ac = bd Send Gc and a to Alice Send Gd and b to Bob Alice calculates Gacp = Gnp Bob calculates Gbdp = Gnp The bitcoin addresses match. Alice then tries to release the escrow by sending Bob a. Bob calculates a*b*p, which is useless. Basically, griefers can abuse the protocol to cause people to lose money. p = Gabr, then bitcoin address from Gabp, solves this by making sure that the bitcoin address won''t match." [ref=e601]':
