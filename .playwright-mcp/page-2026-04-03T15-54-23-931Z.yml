                              - separator [ref=e798]
                              - generic [ref=e799]:
                                - text: Here is how I anticipate myself doing the fix - I'd like to solicit commentary on it, especially if anyone can find any problem with it.
                                - text: When I generate the P code (payment confirmation code starting with einvp), I am currently using the second "pubkey" field (which doesn't have any critical function and can be repurposed) to convey the bitcoin address, simply so the receiver of the code has some way to auto-confirm that they are generating the same bitcoin address. This protects against accidental use of the wrong/mismatched code, but doesn't protect against malicious generation of pairs of escrow invitations that appear to match but which can never produce a working private key.
                                - text: "What I am thinking of doing instead would be to use this field to provide a sha256 hash of all of the following, concatenated together:"
                                - text: "(Assume the person generating it got escrow invitation part A - simply flip everything if part B is the one generating payment invite):"
                                - text: "* Pubkey included in A's escrow invitation + Pubkey derived from private key included in A's escrow invitation + Expected Bitcoin Address or related hash thereof"
                                - text: The first pubkey will have come directly from the escrow agent, and is something the person with escrow invite part B should be able to calculate.
                                - text: The second pubkey can be calculated from escrow invite part A, and is something the person with part B should already have.
                                - text: The Bitcoin address can be calculated from both.
                                - text: The end result is that the person who is validating the payment invitation code based on codes given by others will be the one to cross-check everything and throw up an error if something doesn't check out.
                                - text: Assuming I make this change, the verify invitations screen ("be a payee" screen) will refuse to verify old invitations based on the new criteria, but I anticipate making the "collect your funds" screen continue to accept them, just throw up a warning if these new checks don't check out. These changes don't alter the first "private keypart" field that the collect funds screen uses so it would continue to work, this way existing invitations remain redeemable after the changes are made, despite a warning.
                          - row "Companies claiming they got hacked and lost your coins sounds like fraud so perfect it could be called fashionable. I never believe them. If I ever experience the misfortune of a real intrusion, I declare I have been honest about the way I have managed the keys in Casascius Coins. I maintain no ability to recover or reproduce the keys, not even under limitless duress or total intrusion. Remember that trusting strangers with your coins without any recourse is, as a matter of principle, not a best practice. Don't keep coins online. Use paper or hardware wallets instead." [ref=e800]:
