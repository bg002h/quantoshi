                          - 'row "casascius Mike Caldwell VIP Legendary * Activity: 1386 Merit: 1191 The Casascius 1oz 10BTC Silver Round (w/ Gold B) View Profile WWW Re: Your opinion: Best Bitcoin Non-Trust Transactions Solution? February 01, 2013, 04:49:37 PM #7 My implementation actually does not use multisig at all. It uses elliptic curve multiplication to derive a single normal keypair for an address whose private key nobody can know until a release of funds has occurred. The private key is the product of three factors, and each party (payer, payee, escrow agent) knows only 2 of the factors, as well as G*n. n is the factor they don''t have, having G*n permits them to compute the bitcoin address without access to the private key. Only when someone has been given the missing factor can they compute the private key and take the funds." [ref=e363]':
