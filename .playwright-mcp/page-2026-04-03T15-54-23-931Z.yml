                                - rowgroup [ref=e125]:
                                  - row [ref=e126]:
                                    - cell [ref=e127]
                                  - row [ref=e128]:
                                    - cell [ref=e129]
                                    - cell [ref=e130]
          - 'row "jerfelix Sr. Member **** Activity: 266 Merit: 250 View Profile Re: Your opinion: Best Bitcoin Non-Trust Transactions Solution? January 31, 2013, 10:46:49 PM #2 There could be a \"rating convention\": After you complete a transaction, you rate on a scale of 1-10 how the transaction went. You pay the other party in satoshis: 1 to 10. The votes are public, so analysis of the block chain could determine scamming and ballot stuffing. Analysis of the block chain could also link the rating to the size of the transaction, with some errors. Generally, one party would send 10 to the other, and the other would return 10 back (for a flawless transaction). Ten 1''s aren''t the same as one 10. An average rating could be calculated by averaging all tiny transactions. It''s not quite as good as \"A+++++++++++++++++ Would do business again\", but hey, this is brainstorming, so there are no bad ideas." [ref=e131]':
