                              - separator [ref=e660]
                              - generic [ref=e661]:
                                - text: Yes I did think of that abuse as possible, but didn't expect it to be likely. Nevertheless... you're right... it should be protected against.
                                - text: One remedy is for the party creating the payment invitation to also calculate and send G * the private part he knows - something the other guy should already have - so he can crosscheck it while confirming the bitcoin address.
                                - text: This is actually quite possible. Each of the strings (einva, einvb, einvp) has room for one pubkey, one privkey, 32 bit hash, and some flags. The "einvp" doesn't use the pubkey field for anything important, I just throw the bitcoin address in there, but that's really a waste of the space. That space might better be used for this purpose. I wanted all the strings to be roughly the same length, so I felt I'd rather waste that space than shorten it. Now we have a perfect use for it.
