                                      - 'link "Your opinion: Best Bitcoin Non-Trust Transactions Solution?" [ref=e115] [cursor=pointer]':
                                        - /url: https://bitcointalk.org/index.php?topic=140329.msg1493919#msg1493919
                                      - generic [ref=e116]: January 31, 2013, 06:39:14 PM
                                    - cell "#1" [ref=e117]:
                                      - link "#1" [ref=e119] [cursor=pointer]:
                                        - /url: https://bitcointalk.org/index.php?topic=140329.msg1493919#msg1493919
                              - separator [ref=e120]
                              - generic [ref=e121]:
                                - text: For Bitcoin to replace Paypal and/or become the medium of exchange over the internet we need an efficient solution for non-trust based single transactions.
                                - text: If I'm sending someone gold bullion coins, I sure as hell want some way to ensure I get my Bitcoins.
                                - text: "A few possible solutions:"
                                - text: 1) Escrow
                                - text: "Downsides: Clunky, adds friction and expense to the transaction."
                                - text: 2) Kill switch
                                - text: "Downsides: Both parties lose if anyone uses the kill switch."
                                - text: 3) 3 or more parties signatures required.
                                - text: "Downsides: The other parties could be in on the scam."
                                - text: 4) Some kind of eBay style global feedback registry.
                                - text: "Downsides: It could be gamed using multi-accounts. Possibly this problem could be solved factoring in history and volume metrics, making it harder to game."
                                - text: Ideally the registry would be stored block chain style in a decentralized fashion. Perhaps even built into the current blockchain in the next client updates.
                                - text: This would allow reputation and some kind of credit to be developed by a Bitcoin buyer/seller over time.
                                - text: What else? What other solutions can you think of?
                                - text: Lets start a brainstorm here and solve this problem…
                          - row [ref=e122]:
                            - cell [ref=e123]:
