                            - generic [ref=e308]:
                              - 'link "Quote from: Gordonium on October 16, 2013, 11:22:44 PM" [ref=e310] [cursor=pointer]':
                                - /url: https://bitcointalk.org/index.php?topic=12156.msg3352545#msg3352545
                              - generic [ref=e311]: How many Bitcoins you will need to hold to be part of this new elite?
                              - text: Only if we have more than about BTC70k at these prices, dear. so its still long way to go for weathy elite gentlemen
                              - img "Huh" [ref=e312]
                            - text: You have to put things in context. Back then, things were changing really fast. I remember these coin things that I made with my laptop and I thought were worthless actually had a non-zero value...it was surprising.
                            - text: Don't forget, early on, every body (not many) had more coins than they knew what to do with...because there was nothing to do with them...Gavin started giving them away in a recycling faucet...you request 5 BTC play with it...send it back when you're done...it was a trivial amount of bitcoin for the time...
                            - text: Going from a value of 0 to not 0 was a huge "% increase". It seemed every month the price went up...then every week...then every day...the effect on one's brain of this process was truly remarkable to experience...it was (for me) unbelievable...but I believe it now...Bitcoin is here to stay.
