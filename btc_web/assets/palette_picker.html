<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantoshi — Palette Builder</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080d;
  --card: #0e0e16;
  --border: #1a1a28;
  --text: #d4d0c8;
  --dim: #555;
  --btc: #f7931a;
  --accent: #f7931a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}
h1 {
  font-family: 'Instrument Serif', serif;
  font-size: clamp(1.8rem, 4vw, 3rem);
  text-align: center;
  padding: 1.5rem 1rem 0.2rem;
  color: var(--btc);
  letter-spacing: -0.02em;
}
.subtitle {
  text-align: center; font-size: 0.7rem;
  color: var(--dim); margin-bottom: 1.5rem;
}

/* ── Layout ── */
.builder-wrap {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 1.5rem;
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 1rem 3rem;
}
@media (max-width: 800px) {
  .builder-wrap { grid-template-columns: 1fr; }
}

/* ── Left: Source palettes ── */
.source-panel {
  max-height: 85vh;
  overflow-y: auto;
  padding-right: 8px;
}
.source-panel::-webkit-scrollbar { width: 4px; }
.source-panel::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

.source-section { margin-bottom: 1.5rem; }
.source-title {
  font-family: 'Instrument Serif', serif;
  font-size: 1.1rem;
  margin-bottom: 0.5rem;
  color: #aaa;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}
.source-title .tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  padding: 1px 5px;
  border-radius: 2px;
  margin-left: 6px;
  vertical-align: middle;
}
.source-palette-name {
  font-size: 0.65rem; color: #777;
  margin: 6px 0 3px; font-weight: 600;
}
.source-row {
  display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 2px;
}
.source-swatch {
  width: 32px; height: 22px;
  border-radius: 3px;
  border: 1px solid rgba(255,255,255,0.06);
  cursor: grab;
  position: relative;
  transition: transform 0.1s, box-shadow 0.15s;
}
.source-swatch:hover {
  transform: scale(1.15);
  box-shadow: 0 0 8px rgba(255,255,255,0.15);
  z-index: 10;
}
.source-swatch:active { cursor: grabbing; }
.source-swatch .tip {
  display: none;
  position: absolute;
  bottom: 100%; left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: #ccc;
  font-size: 0.5rem;
  padding: 2px 5px;
  border-radius: 3px;
  white-space: nowrap;
  pointer-events: none;
}
.source-swatch:hover .tip { display: block; }

/* ── Right: Builder targets ── */
.targets-panel { }
.mode-builder {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem 1.2rem;
  margin-bottom: 1.5rem;
}
.mode-builder-title {
  font-family: 'Instrument Serif', serif;
  font-size: 1.3rem;
  margin-bottom: 0.8rem;
  display: flex; align-items: center; gap: 8px;
}
.mode-builder-title .tag {
  font-size: 0.5rem;
  padding: 2px 6px;
  border-radius: 2px;
}
.slots-row {
  display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap;
}
.slot {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.slot-box {
  width: 52px; height: 34px;
  border-radius: 5px;
  border: 2px dashed #333;
  background: #0a0a12;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.45rem; color: #333;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
  cursor: pointer;
}
.slot-box.filled {
  border-style: solid;
  border-color: rgba(255,255,255,0.1);
}
.slot-box.drag-over {
  border-color: var(--btc) !important;
  background: rgba(247, 147, 26, 0.08);
}
.slot-box .clear-btn {
  display: none;
  position: absolute; top: -6px; right: -6px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #c62828; color: #fff;
  font-size: 0.5rem; line-height: 14px;
  text-align: center; cursor: pointer;
  border: 1px solid #0a0a12;
}
.slot-box.filled:hover .clear-btn { display: block; }
.slot-label {
  font-size: 0.5rem; color: #555;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.slot-hex {
  font-size: 0.45rem; color: #444; margin-top: -1px;
}

/* ── Preview chart ── */
.preview-chart {
  background: #0a0a10;
  border-radius: 8px;
  border: 1px solid #151520;
  padding: 12px;
  min-height: 140px;
  position: relative;
}
.preview-chart svg {
  width: 100%; height: 120px;
}
.toggle-row {
  display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;
}
.model-toggle {
  font-size: 0.6rem;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid #222;
  background: #111;
  color: #666;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; gap: 4px;
}
.model-toggle .dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  display: inline-block;
}
.model-toggle.active {
  border-color: rgba(255,255,255,0.2);
  color: #ccc;
  background: #1a1a24;
}

/* ── Export button ── */
.export-row {
  text-align: center;
  margin-top: 1rem;
}
.export-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  padding: 8px 20px;
  background: var(--btc);
  color: #000;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.export-btn:hover { filter: brightness(1.15); }
.export-output {
  margin-top: 0.8rem;
  background: #0a0a12;
  border: 1px solid #1a1a28;
  border-radius: 6px;
  padding: 12px;
  font-size: 0.6rem;
  color: #aaa;
  text-align: left;
  white-space: pre;
  overflow-x: auto;
  display: none;
}
</style>
</head>
<body>
<h1>Palette Builder</h1>
<p class="subtitle">Drag colors from candidates (left) into slots (right). Click model toggles to preview traces + shading.</p>

<div class="builder-wrap">
  <div class="source-panel" id="sources"></div>
  <div class="targets-panel" id="targets"></div>
</div>

<script>
var MODELS = ['bub','qr','pl','lppl','ef','exp','s2f'];
var LABELS = {bub:'BM',qr:'QR',pl:'PL',lppl:'LPPL',ef:'EF',exp:'Exp',s2f:'S2F'};

var CANDIDATES = {
  "Default":[
    {name:"Forge",colors:{bub:'#DAA520',qr:'#78909C',pl:'#00BCD4',lppl:'#FF6D00',ef:'#5C6BC0',exp:'#A1887F',s2f:'#FFD54F'}},
    {name:"Neon Circuit",colors:{bub:'#FFB300',qr:'#90A4AE',pl:'#00E5FF',lppl:'#FF3D00',ef:'#448AFF',exp:'#B0BEC5',s2f:'#FFAB00'}},
    {name:"Earth & Sky",colors:{bub:'#C8A415',qr:'#8D9EAA',pl:'#26C6DA',lppl:'#E65100',ef:'#7986CB',exp:'#BCAAA4',s2f:'#FFC107'}},
    {name:"Midnight",colors:{bub:'#FFA726',qr:'#607D8B',pl:'#00ACC1',lppl:'#FF5722',ef:'#42A5F5',exp:'#9E9E9E',s2f:'#FFD740'}},
    {name:"Campfire",colors:{bub:'#E6A817',qr:'#B0BEC5',pl:'#4DD0E1',lppl:'#FF7043',ef:'#64B5F6',exp:'#CE93D8',s2f:'#FFE082'}},
    {name:"Wide Gamut",note:"max separation",colors:{bub:'#FFB300',qr:'#2979FF',pl:'#00E676',lppl:'#FF1744',ef:'#D500F9',exp:'#00BCD4',s2f:'#FF6D00'}},
    {name:"Jewel Tones",note:"saturated gems",colors:{bub:'#FFD600',qr:'#0091EA',pl:'#00C853',lppl:'#D50000',ef:'#AA00FF',exp:'#00BFA5',s2f:'#FF3D00'}},
    {name:"Spectrum 7",note:"full rainbow",colors:{bub:'#FFD000',qr:'#2962FF',pl:'#00E676',lppl:'#FF0000',ef:'#AA00FF',exp:'#00E5FF',s2f:'#FF6D00'}},
    {name:"Vivid Split",note:"complementary pairs",colors:{bub:'#FFC400',qr:'#304FFE',pl:'#00E676',lppl:'#FF1744',ef:'#D500F9',exp:'#1DE9B6',s2f:'#FF9100'}},
    {name:"Prismatic",note:"OKLCH max chroma",colors:{bub:'#FFB300',qr:'#2979FF',pl:'#00E676',lppl:'#FF1744',ef:'#E040FB',exp:'#00BCD4',s2f:'#FF6D00'}},
    {name:"Full Blast",note:"pure primaries",colors:{bub:'#FFD700',qr:'#0000FF',pl:'#00CC00',lppl:'#FF0000',ef:'#FF00FF',exp:'#00CCCC',s2f:'#FF8800'}},
    {name:"Neon Max",note:"electric vivid",colors:{bub:'#FFE000',qr:'#0066FF',pl:'#00FF66',lppl:'#FF0044',ef:'#CC00FF',exp:'#00DDDD',s2f:'#FF6600'}},
    {name:"Paint Box",note:"artist primaries",colors:{bub:'#FFC107',qr:'#1A44CC',pl:'#11AA33',lppl:'#DD0000',ef:'#9900CC',exp:'#00AAAA',s2f:'#EE5500'}},
    {name:"Ultrawide",note:"perceptual max",colors:{bub:'#FFAA00',qr:'#3333FF',pl:'#00DD44',lppl:'#EE0022',ef:'#BB00FF',exp:'#00BBBB',s2f:'#FF5500'}},
    {name:"Signal",note:"traffic+beyond",colors:{bub:'#FFD700',qr:'#0055FF',pl:'#00BB00',lppl:'#EE0000',ef:'#9933FF',exp:'#00CCBB',s2f:'#FF7700'}}
  ],
  "CB-RG":[
    {name:"Tol Bright",colors:{bub:'#EE7733',qr:'#999999',pl:'#0077BB',lppl:'#EE3377',ef:'#33BBEE',exp:'#BBBBBB',s2f:'#CCBB44'}},
    {name:"Okabe-Ito",colors:{bub:'#E69F00',qr:'#999999',pl:'#56B4E9',lppl:'#CC79A7',ef:'#0072B2',exp:'#BBBBBB',s2f:'#F0E442'}},
    {name:"IBM Carbon",colors:{bub:'#FE6100',qr:'#999999',pl:'#648FFF',lppl:'#DC267F',ef:'#785EF0',exp:'#B0B0B0',s2f:'#FFB000'}},
    {name:"Petroff 8",colors:{bub:'#F5793A',qr:'#A8A8A8',pl:'#0F2080',lppl:'#85C0F9',ef:'#A95AA1',exp:'#BBBBBB',s2f:'#F5C242'}},
    {name:"Safe Seas",colors:{bub:'#D4820C',qr:'#90A4AE',pl:'#0288D1',lppl:'#AB47BC',ef:'#4FC3F7',exp:'#B0BEC5',s2f:'#FFD54F'}},
    {name:"Wide Tol",note:"max Tol spread",colors:{bub:'#EE7733',qr:'#AAAAAA',pl:'#004488',lppl:'#EE3377',ef:'#33BBEE',exp:'#777777',s2f:'#DDAA33'}},
    {name:"Bang Wong",note:"Nature Methods",colors:{bub:'#E69F00',qr:'#AAAAAA',pl:'#009E73',lppl:'#CC79A7',ef:'#0072B2',exp:'#777777',s2f:'#F0E442'}},
    {name:"Saturated Safe",note:"high chroma no R/G",colors:{bub:'#FF8F00',qr:'#9E9E9E',pl:'#0D47A1',lppl:'#E91E63',ef:'#00BCD4',exp:'#BDBDBD',s2f:'#FDD835'}},
    {name:"Arctic Blaze",note:"cold/hot extremes",colors:{bub:'#FF6F00',qr:'#90A4AE',pl:'#01579B',lppl:'#AD1457',ef:'#4DD0E1',exp:'#B0BEC5',s2f:'#FFD600'}},
    {name:"Deep Contrast",note:"dark anchors",colors:{bub:'#FF8A00',qr:'#757575',pl:'#1A237E',lppl:'#880E4F',ef:'#26C6DA',exp:'#BDBDBD',s2f:'#FFAB00'}}
  ],
  "CB-Full":[
    {name:"Luminance First",colors:{bub:'#E0A526',qr:'#888888',pl:'#BBDDEE',lppl:'#333333',ef:'#AAAAAA',exp:'#CCCCCC',s2f:'#FFDD44'}},
    {name:"Tol Muted",colors:{bub:'#CC6677',qr:'#999933',pl:'#88CCEE',lppl:'#332288',ef:'#DDCC77',exp:'#AAAAAA',s2f:'#AA4499'}},
    {name:"Shape & Shade",colors:{bub:'#D4A017',qr:'#777777',pl:'#AADDCC',lppl:'#444444',ef:'#BBBBBB',exp:'#999999',s2f:'#EEBB55'}},
    {name:"Ink Wash",colors:{bub:'#B8860B',qr:'#A0A0A0',pl:'#7EC8E3',lppl:'#2C2C2C',ef:'#C0C0C0',exp:'#B0B0B0',s2f:'#DAA520'}},
    {name:"High Contrast",colors:{bub:'#F0C040',qr:'#606060',pl:'#B0E0E6',lppl:'#1A1A1A',ef:'#D0D0D0',exp:'#909090',s2f:'#FFE066'}},
    {name:"Stark 7",note:"max luminance spread",colors:{bub:'#FFD000',qr:'#1A1A1A',pl:'#E0E0E0',lppl:'#505050',ef:'#F5F5F5',exp:'#808080',s2f:'#B8B800'}},
    {name:"Warm/Cool Split",note:"temperature axis",colors:{bub:'#D4A017',qr:'#A0C4E8',pl:'#2C2C2C',lppl:'#E8C49A',ef:'#5A7A94',exp:'#C0C0C0',s2f:'#8B7355'}},
    {name:"Braille Safe",note:"texture-ready",colors:{bub:'#C89632',qr:'#555555',pl:'#CCDDEE',lppl:'#222222',ef:'#EEEEEE',exp:'#999999',s2f:'#AA8833'}},
    {name:"Print Ready",note:"CMYK-friendly",colors:{bub:'#CC9900',qr:'#336699',pl:'#E6E6E6',lppl:'#333333',ef:'#99CCCC',exp:'#999999',s2f:'#CC6600'}},
    {name:"Perceptual Equal",note:"OKLCH L* spaced",colors:{bub:'#D4A520',qr:'#404040',pl:'#C8DDE8',lppl:'#6A6A6A',ef:'#A0A0A0',exp:'#D8D8D8',s2f:'#9A7B2F'}}
  ]
};

var MODES = ['Default','CB-RG','CB-Full'];
var TAGS = {
  'Default':{text:'Full color',bg:'#1a3a1a',color:'#4caf50'},
  'CB-RG':{text:'Deut/Prot safe',bg:'#1a2a3a',color:'#42a5f5'},
  'CB-Full':{text:'All CVD',bg:'#2a1a2a',color:'#ab47bc'}
};

// State: built palettes
var built = {};
MODES.forEach(function(m){ built[m] = {}; MODELS.forEach(function(k){ built[m][k] = null; }); });

// State: active toggles per mode
var active = {};
MODES.forEach(function(m){ active[m] = {}; MODELS.forEach(function(k){ active[m][k] = false; }); });

// Drag state
var dragColor = null;
var dragModel = null;

function hexToRgba(h,a){
  var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

// ── Build source panel ──
function buildSources(){
  var panel = document.getElementById('sources');
  panel.textContent = '';
  Object.keys(CANDIDATES).forEach(function(mode){
    var sec = document.createElement('div');
    sec.className = 'source-section';
    var title = document.createElement('div');
    title.className = 'source-title';
    title.textContent = mode + ' ';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.style.cssText = 'background:'+TAGS[mode].bg+';color:'+TAGS[mode].color;
    tag.textContent = TAGS[mode].text;
    title.appendChild(tag);
    sec.appendChild(title);

    CANDIDATES[mode].forEach(function(pal){
      var nameEl = document.createElement('div');
      nameEl.className = 'source-palette-name';
      nameEl.textContent = pal.name;
      sec.appendChild(nameEl);
      var row = document.createElement('div');
      row.className = 'source-row';
      MODELS.forEach(function(m){
        var sw = document.createElement('div');
        sw.className = 'source-swatch';
        sw.style.background = pal.colors[m];
        sw.draggable = true;
        sw.setAttribute('data-color', pal.colors[m]);
        sw.setAttribute('data-model', m);
        var tip = document.createElement('span');
        tip.className = 'tip';
        tip.textContent = LABELS[m] + ' ' + pal.colors[m];
        sw.appendChild(tip);
        sw.addEventListener('dragstart', function(e){
          dragColor = pal.colors[m];
          dragModel = m;
          e.dataTransfer.setData('text/plain', pal.colors[m]);
          e.dataTransfer.effectAllowed = 'copy';
        });
        row.appendChild(sw);
      });
      sec.appendChild(row);
    });
    panel.appendChild(sec);
  });
}

// ── Build targets panel ──
function buildTargets(){
  var panel = document.getElementById('targets');
  panel.textContent = '';
  MODES.forEach(function(mode){
    var builder = document.createElement('div');
    builder.className = 'mode-builder';
    var titleEl = document.createElement('div');
    titleEl.className = 'mode-builder-title';
    titleEl.textContent = mode + ' ';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.style.cssText = 'background:'+TAGS[mode].bg+';color:'+TAGS[mode].color;
    tag.textContent = TAGS[mode].text;
    titleEl.appendChild(tag);
    builder.appendChild(titleEl);

    // Slots
    var slotsRow = document.createElement('div');
    slotsRow.className = 'slots-row';
    MODELS.forEach(function(m){
      var slot = document.createElement('div');
      slot.className = 'slot';
      var box = document.createElement('div');
      box.className = 'slot-box';
      box.id = 'slot-'+mode+'-'+m;
      box.textContent = '?';
      box.addEventListener('dragover', function(e){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; box.classList.add('drag-over'); });
      box.addEventListener('dragleave', function(){ box.classList.remove('drag-over'); });
      box.addEventListener('drop', function(e){
        e.preventDefault();
        box.classList.remove('drag-over');
        var color = e.dataTransfer.getData('text/plain') || dragColor;
        if(color){
          built[mode][m] = color;
          updateSlot(mode, m);
          updateChart(mode);
        }
      });
      // Clear button
      var clearBtn = document.createElement('div');
      clearBtn.className = 'clear-btn';
      clearBtn.textContent = '\u00d7';
      clearBtn.addEventListener('click', function(e){
        e.stopPropagation();
        built[mode][m] = null;
        updateSlot(mode, m);
        active[mode][m] = false;
        updateChart(mode);
      });
      box.appendChild(clearBtn);

      var label = document.createElement('div');
      label.className = 'slot-label';
      label.textContent = LABELS[m];
      var hex = document.createElement('div');
      hex.className = 'slot-hex';
      hex.id = 'hex-'+mode+'-'+m;
      slot.appendChild(box);
      slot.appendChild(label);
      slot.appendChild(hex);
      slotsRow.appendChild(slot);
    });
    builder.appendChild(slotsRow);

    // Fill-all button row
    var fillRow = document.createElement('div');
    fillRow.style.cssText = 'margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;';
    CANDIDATES[mode].forEach(function(pal){
      var btn = document.createElement('button');
      btn.textContent = pal.name;
      btn.style.cssText = 'font-family:inherit;font-size:0.55rem;padding:2px 8px;background:#1a1a24;color:#888;border:1px solid #222;border-radius:3px;cursor:pointer;';
      btn.addEventListener('click', function(){
        MODELS.forEach(function(m){ built[mode][m] = pal.colors[m]; updateSlot(mode, m); });
        updateChart(mode);
      });
      btn.addEventListener('mouseenter', function(){ btn.style.borderColor='#444'; btn.style.color='#ccc'; });
      btn.addEventListener('mouseleave', function(){ btn.style.borderColor='#222'; btn.style.color='#888'; });
      fillRow.appendChild(btn);
    });
    builder.appendChild(fillRow);

    // Model toggles
    var toggleRow = document.createElement('div');
    toggleRow.className = 'toggle-row';
    toggleRow.id = 'toggles-'+mode;
    MODELS.forEach(function(m){
      var tog = document.createElement('div');
      tog.className = 'model-toggle';
      tog.id = 'toggle-'+mode+'-'+m;
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.id = 'dot-'+mode+'-'+m;
      tog.appendChild(dot);
      tog.appendChild(document.createTextNode(LABELS[m]));
      tog.addEventListener('click', function(){
        if(!built[mode][m]) return;
        active[mode][m] = !active[mode][m];
        updateChart(mode);
      });
      toggleRow.appendChild(tog);
    });
    builder.appendChild(toggleRow);

    // Chart
    var chart = document.createElement('div');
    chart.className = 'preview-chart';
    chart.id = 'chart-'+mode;
    builder.appendChild(chart);

    panel.appendChild(builder);
  });

  // Export
  var exportRow = document.createElement('div');
  exportRow.className = 'export-row';
  var exportBtn = document.createElement('button');
  exportBtn.className = 'export-btn';
  exportBtn.textContent = 'EXPORT PYTHON DICT';
  var exportOut = document.createElement('div');
  exportOut.className = 'export-output';
  exportOut.id = 'export-output';
  exportBtn.addEventListener('click', function(){
    var lines = [];
    MODES.forEach(function(mode){
      var key = mode==='Default'?'default':mode==='CB-RG'?'cb-rg':'cb-full';
      lines.push('"'+key+'": {');
      lines.push('    "model_colors": {');
      MODELS.forEach(function(m,i){
        var c = built[mode][m] || '#888888';
        var comma = i < MODELS.length-1 ? ',' : '';
        lines.push('        "'+m+'": "'+c+'"'+comma+'  # '+LABELS[m]);
      });
      lines.push('    },');
      lines.push('},');
    });
    exportOut.textContent = lines.join('\n');
    exportOut.style.display = 'block';
  });
  exportRow.appendChild(exportBtn);
  exportRow.appendChild(exportOut);
  panel.appendChild(exportRow);
}

function updateSlot(mode, m){
  var box = document.getElementById('slot-'+mode+'-'+m);
  var hex = document.getElementById('hex-'+mode+'-'+m);
  var c = built[mode][m];
  if(c){
    box.style.background = c;
    box.textContent = '';
    box.classList.add('filled');
    var clearBtn = document.createElement('div');
    clearBtn.className = 'clear-btn';
    clearBtn.textContent = '\u00d7';
    clearBtn.addEventListener('click', function(e){
      e.stopPropagation();
      built[mode][m] = null;
      active[mode][m] = false;
      updateSlot(mode, m);
      updateChart(mode);
    });
    box.appendChild(clearBtn);
    hex.textContent = c;
  } else {
    box.style.background = '#0a0a12';
    box.textContent = '?';
    box.classList.remove('filled');
    hex.textContent = '';
  }
  // Update toggle dot
  var dot = document.getElementById('dot-'+mode+'-'+m);
  if(dot) dot.style.background = c || '#333';
}

function updateChart(mode){
  var chartEl = document.getElementById('chart-'+mode);
  var w = 400, h = 120;
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">';

  // Background grid
  for(var gy=20; gy<h; gy+=20){
    svg += '<line x1="0" y1="'+gy+'" x2="'+w+'" y2="'+gy+'" stroke="#151520" stroke-width="0.5"/>';
  }

  // Get active models
  var activeModels = MODELS.filter(function(m){ return active[mode][m] && built[mode][m]; });

  // Update toggle states
  MODELS.forEach(function(m){
    var tog = document.getElementById('toggle-'+mode+'-'+m);
    if(tog) tog.className = 'model-toggle' + (active[mode][m] && built[mode][m] ? ' active' : '');
  });

  if(activeModels.length === 0){
    svg += '<text x="'+w/2+'" y="'+h/2+'" text-anchor="middle" fill="#333" font-size="11" font-family="JetBrains Mono">Click model toggles above to preview</text>';
    svg += '</svg>';
    chartEl.innerHTML = svg;
    return;
  }

  // Draw traces as power-law-like curves spread vertically
  var n = activeModels.length;
  activeModels.forEach(function(m, idx){
    var c = built[mode][m];
    var baseY = h * 0.3 + (idx - n/2) * 15;
    var spread = 12 + idx * 4;

    // Generate upper and lower quantile paths
    var upper = [], lower = [], median = [];
    for(var x=0; x<w; x++){
      var t = x/w;
      var base = baseY - t * 40 + Math.sin(t*6 + idx)*5;
      median.push({x:x, y:base});
      upper.push({x:x, y:base - spread * (0.5 + t*0.8)});
      lower.push({x:x, y:base + spread * (0.5 + t*0.8)});
    }

    // Outer band (8% opacity)
    var outerPath = 'M ' + lower[0].x + ' ' + lower[0].y.toFixed(1);
    lower.forEach(function(p){ outerPath += ' L '+p.x+' '+p.y.toFixed(1); });
    for(var i=upper.length-1;i>=0;i--){ outerPath += ' L '+upper[i].x+' '+upper[i].y.toFixed(1); }
    outerPath += ' Z';
    svg += '<path d="'+outerPath+'" fill="'+hexToRgba(c,0.08)+'" stroke="none"/>';

    // Inner band (15% opacity) — narrower
    var innerUpper = [], innerLower = [];
    for(var x2=0; x2<w; x2++){
      var s2 = spread * 0.5;
      var t2 = x2/w;
      var base2 = median[x2].y;
      innerUpper.push({x:x2, y:base2 - s2*(0.5+t2*0.8)});
      innerLower.push({x:x2, y:base2 + s2*(0.5+t2*0.8)});
    }
    var innerPath = 'M ' + innerLower[0].x + ' ' + innerLower[0].y.toFixed(1);
    innerLower.forEach(function(p){ innerPath += ' L '+p.x+' '+p.y.toFixed(1); });
    for(var j=innerUpper.length-1;j>=0;j--){ innerPath += ' L '+innerUpper[j].x+' '+innerUpper[j].y.toFixed(1); }
    innerPath += ' Z';
    svg += '<path d="'+innerPath+'" fill="'+hexToRgba(c,0.15)+'" stroke="none"/>';

    // Outer traces (25% opacity)
    var upPath = 'M '+upper[0].x+' '+upper[0].y.toFixed(1);
    upper.forEach(function(p){ upPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+upPath+'" stroke="'+c+'" stroke-width="1" fill="none" opacity="0.25"/>';
    var loPath = 'M '+lower[0].x+' '+lower[0].y.toFixed(1);
    lower.forEach(function(p){ loPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+loPath+'" stroke="'+c+'" stroke-width="1" fill="none" opacity="0.25"/>';

    // Inner traces (60% opacity)
    var iuPath = 'M '+innerUpper[0].x+' '+innerUpper[0].y.toFixed(1);
    innerUpper.forEach(function(p){ iuPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+iuPath+'" stroke="'+c+'" stroke-width="1.2" fill="none" opacity="0.6"/>';
    var ilPath = 'M '+innerLower[0].x+' '+innerLower[0].y.toFixed(1);
    innerLower.forEach(function(p){ ilPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+ilPath+'" stroke="'+c+'" stroke-width="1.2" fill="none" opacity="0.6"/>';

    // Median (full opacity)
    var medPath = 'M '+median[0].x+' '+median[0].y.toFixed(1);
    median.forEach(function(p){ medPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+medPath+'" stroke="'+c+'" stroke-width="2" fill="none" opacity="1.0"/>';

    // Label
    svg += '<text x="'+(w-4)+'" y="'+(median[w-1].y-4).toFixed(1)+'" text-anchor="end" fill="'+c+'" font-size="8" font-family="JetBrains Mono" opacity="0.8">'+LABELS[m]+'</text>';
  });

  svg += '</svg>';
  chartEl.innerHTML = svg;
}

// Init
buildSources();
buildTargets();
MODES.forEach(function(mode){ updateChart(mode); });
</script>
</body>
</html>
