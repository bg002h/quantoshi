<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantoshi — Palette Builder</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080d;
  --card: #0e0e16;
  --border: #1a1a28;
  --text: #d4d0c8;
  --dim: #555;
  --btc: #f7931a;
  --accent: #f7931a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}
h1 {
  font-family: 'Instrument Serif', serif;
  font-size: clamp(1.8rem, 4vw, 3rem);
  text-align: center;
  padding: 1.5rem 1rem 0.2rem;
  color: var(--btc);
  letter-spacing: -0.02em;
}
.subtitle {
  text-align: center; font-size: 0.7rem;
  color: var(--dim); margin-bottom: 1.5rem;
}

/* ── Layout ── */
.builder-wrap {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 1.5rem;
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 1rem 3rem;
}
@media (max-width: 800px) {
  .builder-wrap { grid-template-columns: 1fr; }
}

/* ── Left: Source palettes ── */
.source-panel {
  max-height: 85vh;
  overflow-y: auto;
  padding-right: 8px;
}
.source-panel::-webkit-scrollbar { width: 4px; }
.source-panel::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

.source-section { margin-bottom: 1.5rem; }
.source-title {
  font-family: 'Instrument Serif', serif;
  font-size: 1.1rem;
  margin-bottom: 0.5rem;
  color: #aaa;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}
.source-title .tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  padding: 1px 5px;
  border-radius: 2px;
  margin-left: 6px;
  vertical-align: middle;
}
.source-palette-name {
  font-size: 0.65rem; color: #777;
  margin: 6px 0 3px; font-weight: 600;
}
.source-row {
  display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 2px;
}
.source-swatch {
  width: 32px; height: 22px;
  border-radius: 3px;
  border: 1px solid rgba(255,255,255,0.06);
  cursor: grab;
  position: relative;
  transition: transform 0.1s, box-shadow 0.15s;
}
.source-swatch:hover {
  transform: scale(1.15);
  box-shadow: 0 0 8px rgba(255,255,255,0.15);
  z-index: 10;
}
.source-swatch:active { cursor: grabbing; }
.source-swatch .tip {
  display: none;
  position: absolute;
  bottom: 100%; left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: #ccc;
  font-size: 0.5rem;
  padding: 2px 5px;
  border-radius: 3px;
  white-space: nowrap;
  pointer-events: none;
}
.source-swatch:hover .tip { display: block; }

/* ── Right: Builder targets ── */
.targets-panel { }
.mode-builder {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem 1.2rem;
  margin-bottom: 1.5rem;
}
.mode-builder-title {
  font-family: 'Instrument Serif', serif;
  font-size: 1.3rem;
  margin-bottom: 0.8rem;
  display: flex; align-items: center; gap: 8px;
}
.mode-builder-title .tag {
  font-size: 0.5rem;
  padding: 2px 6px;
  border-radius: 2px;
}
.slots-row {
  display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap;
}
.slot {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.slot-box {
  width: 52px; height: 34px;
  border-radius: 5px;
  border: 2px dashed #333;
  background: #0a0a12;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.45rem; color: #333;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
  cursor: pointer;
}
.slot-box.filled {
  border-style: solid;
  border-color: rgba(255,255,255,0.1);
}
.slot-box.drag-over {
  border-color: var(--btc) !important;
  background: rgba(247, 147, 26, 0.08);
}
.slot-box .clear-btn {
  display: none;
  position: absolute; top: -6px; right: -6px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #c62828; color: #fff;
  font-size: 0.5rem; line-height: 14px;
  text-align: center; cursor: pointer;
  border: 1px solid #0a0a12;
}
.slot-box.filled:hover .clear-btn { display: block; }
.slot-label {
  font-size: 0.5rem; color: #555;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.slot-hex {
  font-size: 0.45rem; color: #444; margin-top: -1px;
}

/* ── Preview chart ── */
.preview-chart {
  background: #ffffff;
  border-radius: 8px;
  border: 1px solid #ddd;
  padding: 12px;
  min-height: 140px;
  position: relative;
}
.preview-chart svg {
  width: 100%; height: 120px;
}
.toggle-row {
  display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;
}
.model-toggle {
  font-size: 0.6rem;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid #222;
  background: #111;
  color: #666;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; gap: 4px;
}
.model-toggle .dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  display: inline-block;
}
.model-toggle.active {
  border-color: rgba(255,255,255,0.2);
  color: #ccc;
  background: #1a1a24;
}

/* ── Export button ── */
.export-row {
  text-align: center;
  margin-top: 1rem;
}
.export-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  padding: 8px 20px;
  background: var(--btc);
  color: #000;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.export-btn:hover { filter: brightness(1.15); }
.export-output {
  margin-top: 0.8rem;
  background: #0a0a12;
  border: 1px solid #1a1a28;
  border-radius: 6px;
  padding: 12px;
  font-size: 0.6rem;
  color: #aaa;
  text-align: left;
  white-space: pre;
  overflow-x: auto;
  display: none;
}
</style>
</head>
<body>
<h1>Palette Builder</h1>
<p class="subtitle">Drag colors from candidates (left) into slots (right). Click model toggles to preview traces + shading.</p>

<div class="builder-wrap">
  <div class="source-panel" id="sources"></div>
  <div class="targets-panel" id="targets"></div>
</div>

    {name:"Pure Cyan",note:"G+B",colors:{bub:'#00FFFF',qr:'#00FFFF',pl:'#00FFFF',lppl:'#00FFFF',ef:'#00FFFF',exp:'#00FFFF',s2f:'#00FFFF'}}
  ],
  "CB-RG":[

    {name:"IBM Carbon",colors:{bub:'#FE6100',qr:'#999999',pl:'#648FFF',lppl:'#DC267F',ef:'#785EF0',exp:'#B0B0B0',s2f:'#FFB000'}},
    {name:"Petroff 8",colors:{bub:'#F5793A',qr:'#A8A8A8',pl:'#0F2080',lppl:'#85C0F9',ef:'#A95AA1',exp:'#BBBBBB',s2f:'#F5C242'}},
    {name:"Safe Seas",colors:{bub:'#D4820C',qr:'#90A4AE',pl:'#0288D1',lppl:'#AB47BC',ef:'#4FC3F7',exp:'#B0BEC5',s2f:'#FFD54F'}},
    {name:"Wide Tol",note:"max Tol spread",colors:{bub:'#EE7733',qr:'#AAAAAA',pl:'#004488',lppl:'#EE3377',ef:'#33BBEE',exp:'#777777',s2f:'#DDAA33'}},
    {name:"Bang Wong",note:"Nature Methods",colors:{bub:'#E69F00',qr:'#AAAAAA',pl:'#009E73',lppl:'#CC79A7',ef:'#0072B2',exp:'#777777',s2f:'#F0E442'}},
    {name:"Saturated Safe",note:"high chroma no R/G",colors:{bub:'#FF8F00',qr:'#9E9E9E',pl:'#0D47A1',lppl:'#E91E63',ef:'#00BCD4',exp:'#BDBDBD',s2f:'#FDD835'}},
    {name:"Arctic Blaze",note:"cold/hot extremes",colors:{bub:'#FF6F00',qr:'#90A4AE',pl:'#01579B',lppl:'#AD1457',ef:'#4DD0E1',exp:'#B0BEC5',s2f:'#FFD600'}},
    {name:"Deep Contrast",note:"dark anchors",colors:{bub:'#FF8A00',qr:'#757575',pl:'#1A237E',lppl:'#880E4F',ef:'#26C6DA',exp:'#BDBDBD',s2f:'#FFAB00'}}
  ],

    {name:"Print Ready",note:"CMYK-friendly",colors:{bub:'#CC9900',qr:'#336699',pl:'#E6E6E6',lppl:'#333333',ef:'#99CCCC',exp:'#999999',s2f:'#CC6600'}},
    {name:"Perceptual Equal",note:"OKLCH L* spaced",colors:{bub:'#D4A520',qr:'#404040',pl:'#C8DDE8',lppl:'#6A6A6A',ef:'#A0A0A0',exp:'#D8D8D8',s2f:'#9A7B2F'}}

var MODES = ['Default','CB-Brian','CB-RG','CB-Full'];
var TAGS = {
  'Default':{text:'Full color',bg:'#1a3a1a',color:'#4caf50'},
  'CB-Brian':{text:'\u0394E\u2032 optimized',bg:'#2a2a1a',color:'#f7931a'},
  'CB-RG':{text:'Deut/Prot safe',bg:'#1a2a3a',color:'#42a5f5'},
  'CB-Full':{text:'All CVD',bg:'#2a1a2a',color:'#ab47bc'}
};

// State: built palettes
var built = {};
MODES.forEach(function(m){ built[m] = {}; MODELS.forEach(function(k){ built[m][k] = null; }); });

// State: active toggles per mode
var active = {};
MODES.forEach(function(m){ active[m] = {}; MODELS.forEach(function(k){ active[m][k] = false; }); });

// Drag state
var dragColor = null;
var dragModel = null;

function hexToRgba(h,a){
  var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

// ── Build source panel ──
function buildSources(){
  var panel = document.getElementById('sources');
  panel.textContent = '';
  Object.keys(CANDIDATES).forEach(function(mode){
    var sec = document.createElement('div');
    sec.className = 'source-section';
    var title = document.createElement('div');
    title.className = 'source-title';
    title.textContent = mode + ' ';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.style.cssText = 'background:'+TAGS[mode].bg+';color:'+TAGS[mode].color;
    tag.textContent = TAGS[mode].text;
    title.appendChild(tag);
    sec.appendChild(title);

    CANDIDATES[mode].forEach(function(pal){
      var nameEl = document.createElement('div');
      nameEl.className = 'source-palette-name';
      nameEl.textContent = pal.name;
      sec.appendChild(nameEl);
      var row = document.createElement('div');
      row.className = 'source-row';
      MODELS.forEach(function(m){
        var sw = document.createElement('div');
        sw.className = 'source-swatch';
        sw.style.background = pal.colors[m];
        sw.draggable = true;
        sw.setAttribute('data-color', pal.colors[m]);
        sw.setAttribute('data-model', m);
        var tip = document.createElement('span');
        tip.className = 'tip';
        tip.textContent = LABELS[m] + ' ' + pal.colors[m];
        sw.appendChild(tip);
        sw.addEventListener('dragstart', function(e){
          dragColor = pal.colors[m];
          dragModel = m;
          e.dataTransfer.setData('text/plain', pal.colors[m]);
          e.dataTransfer.effectAllowed = 'copy';
        });
        row.appendChild(sw);
      });
      sec.appendChild(row);
    });
    panel.appendChild(sec);
  });
}

// ── Build targets panel ──
function buildTargets(){
  var panel = document.getElementById('targets');
  panel.textContent = '';
  MODES.forEach(function(mode){
    var builder = document.createElement('div');
    builder.className = 'mode-builder';
    var titleEl = document.createElement('div');
    titleEl.className = 'mode-builder-title';
    titleEl.textContent = mode + ' ';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.style.cssText = 'background:'+TAGS[mode].bg+';color:'+TAGS[mode].color;
    tag.textContent = TAGS[mode].text;
    titleEl.appendChild(tag);
    builder.appendChild(titleEl);

    // Slots
    var slotsRow = document.createElement('div');
    slotsRow.className = 'slots-row';
    MODELS.forEach(function(m){
      var slot = document.createElement('div');
      slot.className = 'slot';
      var box = document.createElement('div');
      box.className = 'slot-box';
      box.id = 'slot-'+mode+'-'+m;
      box.textContent = '?';
      box.addEventListener('dragover', function(e){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; box.classList.add('drag-over'); });
      box.addEventListener('dragleave', function(){ box.classList.remove('drag-over'); });
      box.addEventListener('drop', function(e){
        e.preventDefault();
        box.classList.remove('drag-over');
        var color = e.dataTransfer.getData('text/plain') || dragColor;
        if(color){
          built[mode][m] = color;
          updateSlot(mode, m);
          updateChart(mode);
        }
      });
      // Clear button
      var clearBtn = document.createElement('div');

      tog.appendChild(document.createTextNode(LABELS[m]));

function updateSlot(mode, m){
  var box = document.getElementById('slot-'+mode+'-'+m);
  var hex = document.getElementById('hex-'+mode+'-'+m);
  var c = built[mode][m];
  if(c){
    box.style.background = c;
    box.textContent = '';
    box.classList.add('filled');
    var clearBtn = document.createElement('div');
    clearBtn.className = 'clear-btn';
    clearBtn.textContent = '\u00d7';
    clearBtn.addEventListener('click', function(e){
      e.stopPropagation();
      built[mode][m] = null;
      active[mode][m] = false;
      updateSlot(mode, m);
      updateChart(mode);
    });
    box.appendChild(clearBtn);
    hex.textContent = c;
  } else {
    box.style.background = '#0a0a12';
    box.textContent = '?';
    box.classList.remove('filled');
    hex.textContent = '';
  }
  // Update toggle dot
  var dot = document.getElementById('dot-'+mode+'-'+m);
  if(dot) dot.style.background = c || '#333';
}

function updateChart(mode){
  var chartEl = document.getElementById('chart-'+mode);
  var w = 400, h = 120;
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">';

  // Background grid
  for(var gy=20; gy<h; gy+=20){
    svg += '<line x1="0" y1="'+gy+'" x2="'+w+'" y2="'+gy+'" stroke="#e0e0e0" stroke-width="0.5"/>';
  }

  // Get active models
  var activeModels = MODELS.filter(function(m){ return active[mode][m] && built[mode][m]; });

  // Update toggle states
  MODELS.forEach(function(m){
    var tog = document.getElementById('toggle-'+mode+'-'+m);
    if(tog) tog.className = 'model-toggle' + (active[mode][m] && built[mode][m] ? ' active' : '');
  });

  if(activeModels.length === 0){
    svg += '<text x="'+w/2+'" y="'+h/2+'" text-anchor="middle" fill="#bbb" font-size="11" font-family="JetBrains Mono">Click model toggles above to preview</text>';
    svg += '</svg>';
    chartEl.innerHTML = svg;
    return;
  }

  // Draw traces as power-law-like curves spread vertically
  var n = activeModels.length;
  activeModels.forEach(function(m, idx){
    var c = built[mode][m];
    var baseY = h * 0.3 + (idx - n/2) * 15;
    var spread = 12 + idx * 4;

    // Generate upper and lower quantile paths
    var upper = [], lower = [], median = [];
    for(var x=0; x<w; x++){
      var t = x/w;
      var base = baseY - t * 40 + Math.sin(t*6 + idx)*5;
      median.push({x:x, y:base});
      upper.push({x:x, y:base - spread * (0.5 + t*0.8)});
      lower.push({x:x, y:base + spread * (0.5 + t*0.8)});
    }

    // Outer band (8% opacity)
    var outerPath = 'M ' + lower[0].x + ' ' + lower[0].y.toFixed(1);
    lower.forEach(function(p){ outerPath += ' L '+p.x+' '+p.y.toFixed(1); });
    for(var i=upper.length-1;i>=0;i--){ outerPath += ' L '+upper[i].x+' '+upper[i].y.toFixed(1); }
    outerPath += ' Z';
    svg += '<path d="'+outerPath+'" fill="'+hexToRgba(c,0.08)+'" stroke="none"/>';

    // Inner band (15% opacity) — narrower
    var innerUpper = [], innerLower = [];
    for(var x2=0; x2<w; x2++){
      var s2 = spread * 0.5;
      var t2 = x2/w;
      var base2 = median[x2].y;
      innerUpper.push({x:x2, y:base2 - s2*(0.5+t2*0.8)});
      innerLower.push({x:x2, y:base2 + s2*(0.5+t2*0.8)});
    }
    var innerPath = 'M ' + innerLower[0].x + ' ' + innerLower[0].y.toFixed(1);
    innerLower.forEach(function(p){ innerPath += ' L '+p.x+' '+p.y.toFixed(1); });
    for(var j=innerUpper.length-1;j>=0;j--){ innerPath += ' L '+innerUpper[j].x+' '+innerUpper[j].y.toFixed(1); }
    innerPath += ' Z';
    svg += '<path d="'+innerPath+'" fill="'+hexToRgba(c,0.15)+'" stroke="none"/>';

    // Outer traces (25% opacity)
    var upPath = 'M '+upper[0].x+' '+upper[0].y.toFixed(1);
    upper.forEach(function(p){ upPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+upPath+'" stroke="'+c+'" stroke-width="1" fill="none" opacity="0.25"/>';
    var loPath = 'M '+lower[0].x+' '+lower[0].y.toFixed(1);
    lower.forEach(function(p){ loPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+loPath+'" stroke="'+c+'" stroke-width="1" fill="none" opacity="0.25"/>';

    // Inner traces (60% opacity)
    var iuPath = 'M '+innerUpper[0].x+' '+innerUpper[0].y.toFixed(1);
    innerUpper.forEach(function(p){ iuPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+iuPath+'" stroke="'+c+'" stroke-width="1.2" fill="none" opacity="0.6"/>';
    var ilPath = 'M '+innerLower[0].x+' '+innerLower[0].y.toFixed(1);
    innerLower.forEach(function(p){ ilPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+ilPath+'" stroke="'+c+'" stroke-width="1.2" fill="none" opacity="0.6"/>';

    // Median (full opacity)
    var medPath = 'M '+median[0].x+' '+median[0].y.toFixed(1);
    median.forEach(function(p){ medPath += ' L '+p.x+' '+p.y.toFixed(1); });
    svg += '<path d="'+medPath+'" stroke="'+c+'" stroke-width="2" fill="none" opacity="1.0"/>';

    // Label
    svg += '<text x="'+(w-4)+'" y="'+(median[w-1].y-4).toFixed(1)+'" text-anchor="end" fill="'+c+'" font-size="8" font-family="JetBrains Mono" opacity="0.8">'+LABELS[m]+'</text>';
  });

  svg += '</svg>';
  chartEl.innerHTML = svg;
}

buildSources();
buildTargets();
MODES.forEach(function(mode){ updateChart(mode); });

// Color Space Visualizer
// ══════════════════════════════════════════════════════════════════════════════

var csColors = []; // [{hex, label}]

function hexToHSL(hex){
  var r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  var max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  var h=0, s=0, l=(max+min)/2;
  if(d>0){
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    if(max===r) h=((g-b)/d+(g<b?6:0))/6;
    else if(max===g) h=((b-r)/d+2)/6;
    else h=((r-g)/d+4)/6;
  }
  return {h:h*360, s:s*100, l:l*100};
}

function hexToLab(hex){
  // sRGB -> XYZ -> CIELAB (D65)
  var r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  function lin(v){ return v>0.04045 ? Math.pow((v+0.055)/1.055, 2.4) : v/12.92; }
  r=lin(r); g=lin(g); b=lin(b);
  var x=(0.4124564*r+0.3575761*g+0.1804375*b)/0.95047;
  var y=(0.2126729*r+0.7151522*g+0.0721750*b)/1.0;
  var z=(0.0193339*r+0.1191920*g+0.9503041*b)/1.08883;
  function f(t){ return t>0.008856 ? Math.pow(t,1/3) : 7.787*t+16/116; }
  x=f(x); y=f(y); z=f(z);
  return { L: 116*y-16, a: 500*(x-y), b: 200*(y-z) };
}

function deltaE(c1,c2){
  var lab1=hexToLab(c1), lab2=hexToLab(c2);
  return Math.sqrt(Math.pow(lab1.L-lab2.L,2)+Math.pow(lab1.a-lab2.a,2)+Math.pow(lab1.b-lab2.b,2));
}

function deltaE_reflected(c1,c2){
  // Delta-E in reflected space: |a*| collapses red-green axis
  var lab1=hexToLab(c1), lab2=hexToLab(c2);
  var a1=Math.abs(lab1.a), a2=Math.abs(lab2.a);
  return Math.sqrt(Math.pow(lab1.L-lab2.L,2)+Math.pow(a1-a2,2)+Math.pow(lab1.b-lab2.b,2));
}

function addCSColor(hex, label){
  // Don't duplicate
  if(csColors.some(function(c){ return c.hex===hex; })) return;
  csColors.push({hex:hex, label:label||hex});
  renderCS();
}

function removeCSColor(hex){
  csColors = csColors.filter(function(c){ return c.hex!==hex; });
  renderCS();
}

function renderCS(){
  var wrap = document.getElementById('cs-wrap');
  if(!wrap) return;

  // Selected swatches row
  var selRow = document.getElementById('cs-selected');
  selRow.textContent = '';
  csColors.forEach(function(c){
    var chip = document.createElement('div');
    chip.style.cssText = 'display:inline-flex;align-items:center;gap:4px;margin:2px 4px;padding:2px 6px;background:#111;border:1px solid #222;border-radius:4px;cursor:pointer;font-size:0.55rem;color:#aaa;';
    var dot = document.createElement('span');
    dot.style.cssText = 'width:12px;height:12px;border-radius:2px;display:inline-block;background:'+c.hex+';';
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(c.label+' '+c.hex));
    var x = document.createElement('span');
    x.textContent = ' \u00d7';
    x.style.cssText = 'color:#c62828;margin-left:4px;';
    chip.appendChild(x);
    chip.addEventListener('click', function(){ removeCSColor(c.hex); });
    selRow.appendChild(chip);
  });

  if(csColors.length < 1){
    document.getElementById('cs-plots').textContent = '';
    return;
  }

  var plotsEl = document.getElementById('cs-plots');
  var W=360, H=240;

  // ── Plot 0: CIELAB a* vs b* (full, unreflected) ──
  var svg0 = '<svg viewBox="-10 -10 '+(W+20)+' '+(H+40)+'" xmlns="http://www.w3.org/2000/svg">';
  svg0 += '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#111" rx="4"/>';
  svg0 += '<line x1="'+W/2+'" y1="0" x2="'+W/2+'" y2="'+H+'" stroke="#333" stroke-width="0.5"/>';
  svg0 += '<line x1="0" y1="'+H/2+'" x2="'+W+'" y2="'+H/2+'" stroke="#333" stroke-width="0.5"/>';
  svg0 += '<text x="'+W/2+'" y="'+(H+14)+'" text-anchor="middle" fill="#555" font-size="8" font-family="JetBrains Mono">a* (green\u2190 \u2192red)</text>';
  svg0 += '<text x="'+(W/2)+'" y="'+(H+28)+'" text-anchor="middle" fill="#777" font-size="9" font-family="JetBrains Mono">CIELAB a* vs b* \u2014 Full Color Vision (\u0394E)</text>';
  var scale0 = W/256;
  csColors.forEach(function(c){
    var lab = hexToLab(c.hex);
    var cx = W/2 + lab.a * scale0;
    var cy = H/2 - lab.b * scale0;
    cx = Math.max(4, Math.min(W-4, cx));
    cy = Math.max(4, Math.min(H-4, cy));
    svg0 += '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="8" fill="'+c.hex+'" stroke="#fff" stroke-width="1.5"/>';
    svg0 += '<text x="'+(cx+10).toFixed(1)+'" y="'+(cy+3).toFixed(1)+'" fill="#aaa" font-size="7" font-family="JetBrains Mono">'+c.label+'</text>';
  });
  for(var i0=0;i0<csColors.length;i0++){
    for(var j0=i0+1;j0<csColors.length;j0++){
      var lab1_0=hexToLab(csColors[i0].hex), lab2_0=hexToLab(csColors[j0].hex);
      var x1_0=W/2+lab1_0.a*scale0, y1_0=H/2-lab1_0.b*scale0;
      var x2_0=W/2+lab2_0.a*scale0, y2_0=H/2-lab2_0.b*scale0;
      x1_0=Math.max(4,Math.min(W-4,x1_0)); y1_0=Math.max(4,Math.min(H-4,y1_0));
      x2_0=Math.max(4,Math.min(W-4,x2_0)); y2_0=Math.max(4,Math.min(H-4,y2_0));
      var de0 = deltaE(csColors[i0].hex, csColors[j0].hex);
      svg0 += '<line x1="'+x1_0.toFixed(1)+'" y1="'+y1_0.toFixed(1)+'" x2="'+x2_0.toFixed(1)+'" y2="'+y2_0.toFixed(1)+'" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" stroke-dasharray="3,3"/>';
      var mx0=(x1_0+x2_0)/2, my0=(y1_0+y2_0)/2;
      svg0 += '<text x="'+mx0.toFixed(1)+'" y="'+(my0-3).toFixed(1)+'" text-anchor="middle" fill="#666" font-size="6" font-family="JetBrains Mono">\u0394E='+de0.toFixed(0)+'</text>';
    }
  }
  svg0 += '</svg>';

  // ── Plot 1: CIELAB |a*| vs b* (R-G collapsed) ──
  var svg1 = '<svg viewBox="-10 -10 '+(W+20)+' '+(H+40)+'" xmlns="http://www.w3.org/2000/svg">';
  svg1 += '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#111" rx="4"/>';
  // Axes — only right half, |a*| on x
  svg1 += '<line x1="10" y1="0" x2="10" y2="'+H+'" stroke="#333" stroke-width="0.5"/>';
  svg1 += '<line x1="0" y1="'+H/2+'" x2="'+W+'" y2="'+H/2+'" stroke="#333" stroke-width="0.5"/>';
  svg1 += '<text x="'+W/2+'" y="'+(H+14)+'" text-anchor="middle" fill="#555" font-size="8" font-family="JetBrains Mono">|a*| (R-G collapsed \u2192 higher = more chromatic)</text>';
  svg1 += '<text x="2" y="'+(H/2-4)+'" fill="#555" font-size="6" font-family="JetBrains Mono" transform="rotate(-90,2,'+(H/2)+')">b* (blue\u2190 \u2192yellow)</text>';
  svg1 += '<text x="'+(W/2)+'" y="'+(H+28)+'" text-anchor="middle" fill="#777" font-size="9" font-family="JetBrains Mono">CIELAB |a*| vs b* \u2014 R/G axis folded</text>';

  // Plot points: |a*| range 0..128 mapped to full width, b* range -128..128
  var scaleX = (W-20)/128;  // |a*| 0..128 → 10..W
  var scaleY = H/256;       // b* -128..128 → 0..H
  csColors.forEach(function(c){
    var lab = hexToLab(c.hex);
    var absA = Math.abs(lab.a);
    var cx = 10 + absA * scaleX;
    var cy = H/2 - lab.b * scaleY;
    cx = Math.max(4, Math.min(W-4, cx));
    cy = Math.max(4, Math.min(H-4, cy));
    svg1 += '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="8" fill="'+c.hex+'" stroke="#fff" stroke-width="1.5"/>';
    svg1 += '<text x="'+(cx+10).toFixed(1)+'" y="'+(cy+3).toFixed(1)+'" fill="#aaa" font-size="7" font-family="JetBrains Mono">'+c.label+'</text>';
  });

  // Draw lines between all pairs with reflected deltaE
  for(var i=0;i<csColors.length;i++){
    for(var j=i+1;j<csColors.length;j++){
      var lab1=hexToLab(csColors[i].hex), lab2=hexToLab(csColors[j].hex);
      var x1=10+Math.abs(lab1.a)*scaleX, y1=H/2-lab1.b*scaleY;
      var x2=10+Math.abs(lab2.a)*scaleX, y2=H/2-lab2.b*scaleY;
      x1=Math.max(4,Math.min(W-4,x1)); y1=Math.max(4,Math.min(H-4,y1));
      x2=Math.max(4,Math.min(W-4,x2)); y2=Math.max(4,Math.min(H-4,y2));
      var de = deltaE_reflected(csColors[i].hex, csColors[j].hex);
      svg1 += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" stroke-dasharray="3,3"/>';
      var mx=(x1+x2)/2, my=(y1+y2)/2;
      svg1 += '<text x="'+mx.toFixed(1)+'" y="'+(my-3).toFixed(1)+'" text-anchor="middle" fill="#666" font-size="6" font-family="JetBrains Mono">\u0394E\u2032='+de.toFixed(0)+'</text>';
    }
  }
  svg1 += '</svg>';

  // ── Plot 2: Hue wheel (HSL H vs S, polar) ──
  var svg2 = '<svg viewBox="-10 -10 '+(W+20)+' '+(H+40)+'" xmlns="http://www.w3.org/2000/svg">';
  svg2 += '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#111" rx="4"/>';
  var cx0=W/2, cy0=H/2, R=Math.min(W,H)/2-20;
  // Hue ring background
  for(var deg=0;deg<360;deg+=10){
    var rad=deg*Math.PI/180;
    var rx1=cx0+R*Math.cos(rad), ry1=cy0-R*Math.sin(rad);
    var rx2=cx0+(R+8)*Math.cos(rad), ry2=cy0-(R+8)*Math.sin(rad);
    svg2 += '<line x1="'+rx1.toFixed(1)+'" y1="'+ry1.toFixed(1)+'" x2="'+rx2.toFixed(1)+'" y2="'+ry2.toFixed(1)+'" stroke="hsl('+deg+',70%,50%)" stroke-width="3" opacity="0.3"/>';
  }
  // Center cross
  svg2 += '<line x1="'+(cx0-R)+'" y1="'+cy0+'" x2="'+(cx0+R)+'" y2="'+cy0+'" stroke="#222" stroke-width="0.5"/>';
  svg2 += '<line x1="'+cx0+'" y1="'+(cy0-R)+'" x2="'+cx0+'" y2="'+(cy0+R)+'" stroke="#222" stroke-width="0.5"/>';
  svg2 += '<text x="'+cx0+'" y="'+(H+14)+'" text-anchor="middle" fill="#555" font-size="8" font-family="JetBrains Mono">Saturation = distance from center</text>';
  svg2 += '<text x="'+cx0+'" y="'+(H+28)+'" text-anchor="middle" fill="#777" font-size="9" font-family="JetBrains Mono">HSL Hue Wheel</text>';

  csColors.forEach(function(c){
    var hsl = hexToHSL(c.hex);
    var rad = hsl.h * Math.PI/180;
    var dist = (hsl.s/100) * R;
    var px = cx0 + dist * Math.cos(rad);
    var py = cy0 - dist * Math.sin(rad);
    svg2 += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="8" fill="'+c.hex+'" stroke="#fff" stroke-width="1.5"/>';
    svg2 += '<text x="'+(px+10).toFixed(1)+'" y="'+(py+3).toFixed(1)+'" fill="#aaa" font-size="7" font-family="JetBrains Mono">'+c.label+'</text>';
  });
  svg2 += '</svg>';

  // ── Distance matrix ──
  // ── Distance matrices: regular + reflected ──
  var matHtml = '<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:16px;">';

  // Regular ΔE
  matHtml += '<div><div style="font-size:0.65rem;color:#777;margin-bottom:6px;">\u0394E — Full Color Vision</div>';
  matHtml += '<table style="border-collapse:collapse;font-size:0.55rem;color:#aaa;">';
  matHtml += '<tr><th style="padding:3px 6px;"></th>';
  csColors.forEach(function(c){ matHtml += '<th style="padding:3px 6px;"><span style="display:inline-block;width:10px;height:10px;background:'+c.hex+';border-radius:2px;vertical-align:middle;margin-right:2px;"></span>'+c.label+'</th>'; });
  matHtml += '</tr>';
  csColors.forEach(function(c1,i){
    matHtml += '<tr><td style="padding:3px 6px;text-align:right;"><span style="display:inline-block;width:10px;height:10px;background:'+c1.hex+';border-radius:2px;vertical-align:middle;margin-right:2px;"></span>'+c1.label+'</td>';
    csColors.forEach(function(c2,j){
      var de = i===j ? '\u2014' : deltaE(c1.hex, c2.hex).toFixed(0);
      var bg = i===j ? '#0a0a12' : (de!=='\u2014' && parseFloat(de)<20 ? 'rgba(198,40,40,0.2)' : (de!=='\u2014' && parseFloat(de)>60 ? 'rgba(76,175,80,0.15)' : '#111'));
      matHtml += '<td style="padding:3px 8px;text-align:center;background:'+bg+';border:1px solid #1a1a22;">'+de+'</td>';
    });
    matHtml += '</tr>';
  });
  matHtml += '</table></div>';

  // Reflected ΔE' (R-G collapsed)
  matHtml += '<div><div style="font-size:0.65rem;color:#777;margin-bottom:6px;">\u0394E\u2032 — R-G Collapsed (colorblind sim)</div>';
  matHtml += '<table style="border-collapse:collapse;font-size:0.55rem;color:#aaa;">';
  matHtml += '<tr><th style="padding:3px 6px;"></th>';
  csColors.forEach(function(c){ matHtml += '<th style="padding:3px 6px;"><span style="display:inline-block;width:10px;height:10px;background:'+c.hex+';border-radius:2px;vertical-align:middle;margin-right:2px;"></span>'+c.label+'</th>'; });
  matHtml += '</tr>';
  csColors.forEach(function(c1,i){
    matHtml += '<tr><td style="padding:3px 6px;text-align:right;"><span style="display:inline-block;width:10px;height:10px;background:'+c1.hex+';border-radius:2px;vertical-align:middle;margin-right:2px;"></span>'+c1.label+'</td>';
    csColors.forEach(function(c2,j){
      var de = i===j ? '\u2014' : deltaE_reflected(c1.hex, c2.hex).toFixed(0);
      var bg = i===j ? '#0a0a12' : (de!=='\u2014' && parseFloat(de)<20 ? 'rgba(198,40,40,0.2)' : (de!=='\u2014' && parseFloat(de)>60 ? 'rgba(76,175,80,0.15)' : '#111'));
      matHtml += '<td style="padding:3px 8px;text-align:center;background:'+bg+';border:1px solid #1a1a22;">'+de+'</td>';
    });
    matHtml += '</tr>';
  });
  matHtml += '</table></div>';

  matHtml += '</div>';
  matHtml += '<div style="font-size:0.5rem;color:#555;margin-top:4px;">\u0394E: perceptual distance (full vision). \u0394E\u2032: R-G axis folded (simulates deuteranopia/protanopia). Red &lt; 20, Green &gt; 60.</div>';

  plotsEl.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">' +
    '<div>'+svg0+'</div><div>'+svg1+'</div><div>'+svg2+'</div></div>' + matHtml;
}

// Build color space section
(function(){
  var csSection = document.createElement('div');
  csSection.style.cssText = 'max-width:1100px;margin:2rem auto;padding:0 1rem;';
  csSection.id = 'cs-wrap';

  var csTitle = document.createElement('h2');
  csTitle.className = 'mode-title';
  csTitle.style.cssText = 'font-family:Instrument Serif,serif;font-size:1.5rem;margin-bottom:0.5rem;border-bottom:1px solid #222;padding-bottom:4px;color:#aaa;';
  csTitle.textContent = 'Color Space Visualizer';
  csSection.appendChild(csTitle);

  var csDesc = document.createElement('p');
  csDesc.style.cssText = 'font-size:0.7rem;color:#666;margin-bottom:0.8rem;';
  csDesc.textContent = 'Click any swatch above or in the source panel to add it here. Click chips below to remove.';
  csSection.appendChild(csDesc);

  var selRow = document.createElement('div');
  selRow.id = 'cs-selected';
  selRow.style.cssText = 'min-height:28px;margin-bottom:10px;padding:4px;background:#0a0a12;border:1px solid #1a1a22;border-radius:6px;';
  csSection.appendChild(selRow);

  var plots = document.createElement('div');
  plots.id = 'cs-plots';
  csSection.appendChild(plots);

  document.body.appendChild(csSection);

  // ── Diagnosis note ──
  var dxNote = document.createElement('div');
  dxNote.style.cssText = 'max-width:1100px;margin:2rem auto;padding:1.2rem;background:#111118;border:1px solid #1a1a28;border-radius:10px;font-size:0.72rem;color:#999;line-height:1.7;';
  dxNote.innerHTML = '<div style="font-family:Instrument Serif,serif;font-size:1.3rem;color:#f7931a;margin-bottom:0.6rem;">Color Vision Profile: Deuteranomaly</div>' +
    '<table style="border-collapse:collapse;margin-bottom:0.8rem;font-size:0.65rem;">' +
    '<tr style="color:#777;"><th style="padding:3px 10px;text-align:left;">Pure color</th><th style="padding:3px 10px;">Appears as</th><th style="padding:3px 10px;">Interpretation</th></tr>' +
    '<tr><td style="padding:3px 10px;"><span style="display:inline-block;width:12px;height:12px;background:#FF0000;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>Red</td><td style="padding:3px 10px;">Red</td><td style="padding:3px 10px;color:#666;">L cone (red) works normally</td></tr>' +
    '<tr><td style="padding:3px 10px;"><span style="display:inline-block;width:12px;height:12px;background:#00FF00;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>Green</td><td style="padding:3px 10px;">Neon green/yellow</td><td style="padding:3px 10px;color:#666;">M cone shifted toward L \u2014 green looks yellowish</td></tr>' +
    '<tr><td style="padding:3px 10px;"><span style="display:inline-block;width:12px;height:12px;background:#0000FF;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>Blue</td><td style="padding:3px 10px;">Blue</td><td style="padding:3px 10px;color:#666;">S cone (blue) works normally</td></tr>' +
    '<tr><td style="padding:3px 10px;"><span style="display:inline-block;width:12px;height:12px;background:#FFFF00;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>Yellow</td><td style="padding:3px 10px;">Yellow (confusable with green)</td><td style="padding:3px 10px;color:#666;">R+G \u2192 same percept as shifted green</td></tr>' +
    '<tr><td style="padding:3px 10px;"><span style="display:inline-block;width:12px;height:12px;background:#FF00FF;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>Magenta</td><td style="padding:3px 10px;">Pinkish blue</td><td style="padding:3px 10px;color:#666;">R+B, but R contribution muted by M overlap</td></tr>' +
    '<tr><td style="padding:3px 10px;"><span style="display:inline-block;width:12px;height:12px;background:#00FFFF;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>Cyan</td><td style="padding:3px 10px;">Near white</td><td style="padding:3px 10px;color:#666;">G+B, but G washed out \u2192 desaturated</td></tr>' +
    '</table>' +
    '<p style="margin-bottom:0.5rem;"><strong style="color:#ccc;">Deuteranomaly</strong> (anomalous trichromacy) \u2014 the M (green) cone is present but its peak sensitivity is shifted toward the L (red) cone. Three cones are active, but L and M overlap more than typical, compressing the red-green axis.</p>' +
    '<p style="margin-bottom:0.5rem;">This is the most common color vision variation (~5% of males). It is <em>not</em> full red-green blindness (deuteranopia) \u2014 some red-green discrimination remains, but green appears yellowish and cyan appears desaturated.</p>' +
    '<p style="color:#777;">The \u0394E\u2032 metric (|a*| reflection) is a slightly conservative model of this condition \u2014 it assumes full R-G collapse, whereas deuteranomaly retains partial discrimination. CB-Brian palettes are optimized for this profile.</p>';
  document.body.appendChild(dxNote);
})();

// Make all source swatches clickable to add to CS
document.addEventListener('click', function(e){
  var sw = e.target.closest('.source-swatch');
  if(sw){
    var hex = sw.getAttribute('data-color');
    var model = sw.getAttribute('data-model');
    addCSColor(hex, LABELS[model]||hex);
    return;
  }
  // Also slot boxes
  var slot = e.target.closest('.slot-box.filled');
  if(slot){
    var bg = slot.style.background;
    if(bg && bg.startsWith('#')){
      addCSColor(bg, bg);
    }
  }
});
