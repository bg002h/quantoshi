    <line x1="50" y1="7" x2="52" y2="27" stroke="#b09050" stroke-width="0.35" opacity="0.15"/>
    <line x1="68" y1="8" x2="66" y2="26" stroke="#a08040" stroke-width="0.3" opacity="0.2"/>
