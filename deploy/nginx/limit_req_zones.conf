# Rate-limit zones for quantoshi.xyz — these live in the `http { }` block of
# /etc/nginx/nginx.conf on the VPS, NOT in the site file, because
# `limit_req_zone` is only valid at http level. `quantoshi.conf` in this
# directory references them by name, so a site file restored without these
# will fail `nginx -t` with "unknown limit_req_zone".
#
# Copy these four lines into the http { } block of /etc/nginx/nginx.conf.
#
# Only `quantoshi` is actually referenced by the enabled site today.
# `dash_cb`, `mc_api` and `health_ep` are referenced only by the STALE
# /etc/nginx/sites-available/quantoshi — see the README in this directory
# before you reach for that file.

limit_req_zone $binary_remote_addr zone=quantoshi:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=dash_cb:10m  rate=2r/s;
limit_req_zone $binary_remote_addr zone=mc_api:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=health_ep:1m rate=6r/m;
