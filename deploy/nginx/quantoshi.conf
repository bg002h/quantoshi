server {
    server_name quantoshi.xyz www.quantoshi.xyz;

    # ── Static assets — served directly by nginx ──────────────────────────
    location /assets/ {
        root /opt/quantoshi/btc_web;
        # Long cache for immutable assets (logos, fonts)
        location ~* \.(png|jpg|svg|ico|woff2?)$ {
            add_header Cache-Control "public, max-age=604800, immutable";
        }
        # Short cache for CSS/JS (may change on deploy)
        location ~* \.(css|js)$ {
            add_header Cache-Control "public, no-cache";
        }
    }

    # ── Health check (no rate limit) ──────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8050;
    }

    # ── Dash JS bundles — long cache (versioned URLs, safe to cache) ──────
    location /_dash-component-suites/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── Dash callbacks — same proxying as `location /`, bigger burst ──────
    # A share-link restore fires ~150 callback POSTs in a few seconds. The
    # general 10r/s + burst 40 rejected the tail with 429, and the Dash
    # renderer only retries 401/403 — a dropped callback leaves its chart
    # blank forever. Sustained rate is unchanged (10r/s once the bucket
    # drains); only the page-load burst is absorbed.
    location = /_dash-update-component {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        limit_req zone=quantoshi burst=200 nodelay;
        limit_req_status 429;
    }

    # ── All other requests → gunicorn ─────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # WebSocket support (Dash live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Rate limit: 10 req/s sustained, burst 20 with nodelay
        limit_req zone=quantoshi burst=40 nodelay;
        limit_req_status 429;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/quantoshi.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/quantoshi.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.quantoshi.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = quantoshi.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name quantoshi.xyz www.quantoshi.xyz;
    return 404; # managed by Certbot
}
