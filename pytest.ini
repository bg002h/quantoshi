[pytest]
# --ignore-glob catches any current + future *_e2e.py (requires Playwright +
# running dev server), so new E2E files don't silently hang the suite.
# -n logical uses all LOGICAL CPUs (24 on this i7-13700K: 16 physical / 24
# threads). `-n auto` only uses physical cores (16) when psutil is installed.
addopts = -n logical --ignore-glob=btc_web/test_*_e2e.py
testpaths = btc_web
